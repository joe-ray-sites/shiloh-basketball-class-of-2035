    <div class="tcc-body">
      <div class="tcc-nick">“${esc(p.nickname)}”</div>
      <div class="tcc-name">${esc(p.first)} <b>${esc(p.last)}</b></div>
      <div class="tcc-pos">${p.position}</div>
    </div>
  </div>`;
}

function compactBack(p) {
  const s = seasonStats(p.num);
  const line = s.gp
    ? `<span class="tccb-label">This season</span>
       <p>${per(s.pts || 0, s.gp)} ppg · ${per(s.reb || 0, s.gp)} rpg · ${s.ast || 0} ast · ${s.stl || 0} stl</p>`
    : `<span class="tccb-label">Fun fact</span><p>${esc(p.fact)}</p>`;
  return `<div class="tccb">
    <div class="tccb-fact">${line}</div>
    <button class="tccb-open" data-open="${p.id}">
      Full card
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>`;
}

function playerCard(p) {
  const v = state.style;
  const flipped = state.flipped.has(p.id);
  // A div, not a button: the back holds its own "View full card" button and the
  // HTML parser would hoist a nested button straight out of the card.
  const compact = NO_PHOTO.has(p.num);
  return `<div class="tc tc-${v}${flipped ? " is-flipped" : ""}${compact ? " is-compact" : ""}"
      role="button" tabindex="0" data-flip="${p.id}" data-num="${p.num}" aria-pressed="${flipped}"
      aria-label="${esc(p.name)}, number ${p.num}, ${p.position}. Activate to flip the card.">
    <div class="tc-inner">
      <div class="tc-face tc-front"${flipped ? " inert" : ""}>
        ${compact ? compactFront(p) : v === "modern" ? modernFront(p) : photoFront(p, v)}
        <span class="tc-flip-hint" aria-hidden="true">
          <span>FLIP</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </span>
      </div>
      <div class="tc-face tc-back"${flipped ? "" : " inert"}>${compact ? compactBack(p) : cardBack(p)}</div>
    </div>
  </div>`;
}

function coachCard(c) {
  const words = c.name.replace(/^Coach\s+/, "").split(" ").filter(w => /[A-Za-z]/.test(w));
  const mono = (words.length > 1 ? words.map(w => w[0]).join("") : (words[0] || "").slice(0, 2)).toUpperCase();
  const brief = !c.motto && !c.fact;
  return `<article class="cc${brief ? " cc-brief" : ""}">
    <div class="cc-top">
      <div class="cc-avatar photo-host">
        <span class="ph-mono" aria-hidden="true">${mono}</span>
        ${img(`assets/coaches/${c.id}.jpg`, c.name, "")}
      </div>
      <div class="cc-tag">${c.tag}</div>
    </div>
    <div class="cc-body">
      <h3 class="cc-name">${esc(c.name)}</h3>
      <div class="cc-role">${esc(c.role)}</div>
      ${c.motto ? `<p class="cc-motto">${esc(c.motto)}</p>` : ""}
      ${c.fact  ? `<p class="cc-fact">${esc(c.fact)}</p>`   : ""}
    </div>
  </article>`;
}

function gameRow(g) {
  const scored = g.final && g.us != null;
  const won  = scored && g.us > g.them;
  const next = g.id === NEXT_ID;
  const right = scored
    ? `<div class="game-res ${won ? "win" : "loss"}">${won ? "W" : "L"} ${g.us}–${g.them}</div>`
    : g.final  ? `<div class="game-upc">No result recorded</div>`
    : next     ? `<div class="game-badge">Next Up</div>`
    : g.playoff ? `<div class="game-badge playoff">${g.week}</div>`
    : `<div class="game-upc">Upcoming</div>`;

  const inner = `
    <div class="game-week">${g.week}</div>
    <div class="game-main">
      <h3 class="game-opp">
        <span class="ha ${g.home ? "home" : "away"}">${g.home ? "VS" : "@"}</span>
        ${esc(g.opp)}
      </h3>
      <div class="game-when">${fmtDate(g.date, { weekday:"short", month:"short", day:"numeric", year:"numeric" })}${scored ? " · Final" : ""}</div>
    </div>
    <div class="game-right">${right}</div>`;

  // Games with a recorded result are tappable and open the box score.
  return scored
    ? `<button class="game is-final" data-box="${g.id}">${inner}
         <span class="game-go" aria-hidden="true">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
         </span>
       </button>`
    : `<article class="game${next ? " is-next" : ""}${g.playoff ? " is-playoff" : ""}">${inner}</article>`;
}

/* Career table, in the spirit of a trading-card back: a row per season and
   a totals row. */
function careerSection(p) {
  const { rows, total } = careerStats(p.num);
  if (!rows.length) return "";
  const cells = (s) => [
    s.gp, s.pts || 0, per(s.pts || 0, s.gp), s.reb || 0, s.ast || 0, s.stl || 0, s.blk || 0,
  ];
  const row = (label, s, cls) =>
    `<tr class="${cls || ""}"><td class="pstat-name">${label}</td>${
      cells(s).map(v => `<td>${v}</td>`).join("")}</tr>`;

  return `<section class="stats career">
    <div class="stats-h">
      <h3>Career Stats</h3>
      <span>${rows.length} season${rows.length === 1 ? "" : "s"}</span>
    </div>
    <div class="pstat-scroll">
      <table>
        <thead><tr>
          <th class="pstat-name">Season</th><th>G</th><th>PTS</th><th>PPG</th>
          <th>REB</th><th>AST</th><th>STL</th><th>BLK</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => row(esc(r.season.short || String(r.season.year)), r.s)).join("")}
          ${rows.length > 1 ? row("Career", total, "career-total") : ""}
        </tbody>
      </table>
    </div>
  </section>`;
}

/* ── Menu page ────────────────────────────────────────────── */
function menuView() {
  return `<div class="mlist">${MENU_PAGES.map(m => `
    <button class="mrow" data-tab="${m.id}">
      <span class="mrow-ico">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${m.icon}"/></svg>
      </span>
      <span class="mrow-txt">
        <b>${m.label}</b>
        <span>${m.desc}</span>
      </span>
      <svg class="mrow-go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>`).join("")}</div>`;
}

/* ── Past seasons ─────────────────────────────────────────────
   A past season reuses the current season's schedule and Team Stats
   views verbatim — same code, different game list. */
function seasonsView() {
  if (!PAST_SEASONS.length) return `<p class="empty">No previous seasons yet — this is the first one.</p>`;
  return `<div class="mlist">${PAST_SEASONS.map(sn => {
    const rec = recordOf(sn.games);
    const played = playedIn(sn.games).length;
    const sub = played
      ? `${rec.w}–${rec.l} · ${played} game${played === 1 ? "" : "s"}`
      : `${sn.games.length} games · stats not entered yet`;
    return `<button class="mrow" data-season="${sn.year}">
      <span class="mrow-yr">${esc(sn.short || sn.year)}</span>
      <span class="mrow-txt"><b>${esc(sn.label)}</b><span>${sub}</span></span>
      <svg class="mrow-go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>`;
  }).join("")}</div>`;
}

function seasonDetailView(year) {
  const sn = seasonByYear(year);
  if (!sn) return `<p class="empty">Unknown season.</p>`;
  const tab = state.seasonTab;
  return `
    <div class="bstabs" role="tablist">
      <button class="bstab ${tab === "schedule" ? "is-on" : ""}" data-seasontab="schedule"
              role="tab" aria-selected="${tab === "schedule"}">Schedule</button>
      <button class="bstab ${tab === "stats" ? "is-on" : ""}" data-seasontab="stats"
              role="tab" aria-selected="${tab === "stats"}">Team Stats</button>
    </div>
    ${tab === "stats"
      ? teamStatsView(playedIn(sn.games), sn.label)
      : `<div class="sched">${sn.games.map(gameRow).join("")}</div>`}`;
}

/* ── Box score (one game) ─────────────────────────────────── */
// Renders a stat table only when at least one player has a line in it.
function statTable(title, cols, rows) {
  if (!rows.length) return "";
  return `<div class="pstat">
    <div class="pstat-h">${title}</div>
    <div class="pstat-scroll">
      <table>
        <thead><tr><th class="pstat-name">Player</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr><td class="pstat-name">${r.name}</td>${
          r.vals.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

const pName = (num, year) => {
  const alt = year && wornByOther(year, num);
  if (alt) return `<b>${num}</b> ${esc(alt.last)}`;
  const p = BY_NUM[num];
  return p ? `<b>${p.num}</b> ${esc(p.last)}` : `<b>${num}</b>`;
};

const QLABEL = ["1st", "2nd", "3rd", "4th", "OT", "2OT", "3OT"];
const qLabel = (i) => QLABEL[i] || `${i - 3}OT`;

// Points by quarter for one game or a whole season.
function lineScore(us, them, opp, totals) {
  const n = Math.max(us.length, them.length);
  const cells = (arr) => Array.from({ length: n }, (_, i) => `<td>${arr[i] ?? dash}</td>`).join("");
  const sum = (arr) => arr.reduce((a, b) => a + (b || 0), 0);
  const tUs = totals ? totals[0] : sum(us), tThem = totals ? totals[1] : sum(them);
  return `<div class="linescore">
    <table>
      <thead><tr><th class="ls-team"></th>${Array.from({ length: n }, (_, i) => `<th>${qLabel(i)}</th>`).join("")}<th>T</th></tr></thead>
      <tbody>
        <tr class="${tUs >= tThem ? "is-win" : "is-lose"}"><td class="ls-team">${TEAM.name}</td>${cells(us)}<td class="ls-tot">${tUs}</td></tr>
        <tr class="${tThem > tUs ? "is-win" : "is-lose"}"><td class="ls-team">${esc(opp)}</td>${cells(them)}<td class="ls-tot">${tThem}</td></tr>
      </tbody>
    </table>
  </div>`;
}

function boxScoreView(id) {
  const g = gameById(id);
  if (!g || g.us == null) return `<p class="empty">No box score for that game yet.</p>`;
  const won = g.us > g.them;
  const hasPlays = !!(g.stats && g.stats.quarters && g.stats.quarters.length);
  const tab = hasPlays ? state.boxTab : "stats";

  const head = `
    <div class="bs-head">
      <div class="bs-meta">Final · ${fmtDate(g.date, { weekday:"long", month:"long", day:"numeric", year:"numeric" })}</div>
      <div class="bs-line ${won ? "is-win" : ""}">
        <span class="bs-team">${TEAM.name}${g.home ? "" : " (away)"}</span>
        <span class="bs-score">${g.us}</span>
      </div>
      <div class="bs-line ${won ? "" : "is-win"}">
        <span class="bs-team">${esc(g.opp)}</span>
        <span class="bs-score">${g.them}</span>
      </div>
    </div>`;

  const tabs = hasPlays ? `
    <div class="bstabs" role="tablist">
      <button class="bstab ${tab === "stats" ? "is-on" : ""}" data-boxtab="stats"
              role="tab" aria-selected="${tab === "stats"}">Box Score</button>
      <button class="bstab ${tab === "plays" ? "is-on" : ""}" data-boxtab="plays"
              role="tab" aria-selected="${tab === "plays"}">Play-by-Play</button>
    </div>` : "";

  return head + tabs + (tab === "plays" ? playsView(g) : boxStatsView(g));
}

/* ── Box score: stats tab ─────────────────────────────────── */
function boxStatsView(g) {
  const s = g.stats || {};
  const t = teamLine(g);
  const o = lineOf((s.team && s.team.opp) || {});
  const q = s.team && s.team.quarters;
  const hasTeam = KEYS.some(k => t[k] != null);

  const players = Object.keys(s.players || {}).map(Number)
    .map(n => ({ n, v: lineOf(s.players[n]) }))
    .sort((a, b) => (b.v.pts || 0) - (a.v.pts || 0) || a.n - b.n)
    .map(({ n, v }) => ({ name: pName(n, g.year),
      vals: [v.pts || 0, ma(v.fgm, v.fga), ma(v.tpm, v.tpa), ma(v.ftm, v.fta),
             fmt(v.reb), fmt(v.ast), fmt(v.stl), fmt(v.blk), fmt(v.to), fmt(v.fouls)] }));

  const cmp = (label, a, b) => `<div class="cmp"><span>${a}</span><em>${label}</em><span>${b}</span></div>`;

  return `
    ${q && q.us ? `<section class="bs-sec"><h3 class="bs-h">Scoring by Quarter</h3>${
        lineScore(q.us, q.them || [], g.opp, [g.us, g.them])}</section>` : ""}

    ${hasTeam ? `
    <section class="bs-sec">
      <h3 class="bs-h">Team Stats</h3>
      <div class="cmp-head"><span>${TEAM.name}</span><em></em><span>${esc(g.opp)}</span></div>
      ${cmp("Field Goals",  ma(t.fgm, t.fga), ma(o.fgm, o.fga))}
      ${cmp("FG %",         t.fga ? pct(t.fgm, t.fga) : dash, o.fga ? pct(o.fgm, o.fga) : dash)}
      ${cmp("3-Pointers",   ma(t.tpm, t.tpa), ma(o.tpm, o.tpa))}
      ${cmp("Free Throws",  ma(t.ftm, t.fta), ma(o.ftm, o.fta))}
      ${cmp("Rebounds",     fmt(t.reb), fmt(o.reb))}
      ${cmp("Assists",      fmt(t.ast), fmt(o.ast))}
      ${cmp("Steals",       fmt(t.stl), fmt(o.stl))}
      ${cmp("Blocks",       fmt(t.blk), fmt(o.blk))}
      ${cmp("Turnovers",    fmt(t.to),  fmt(o.to))}
      ${cmp("Fouls",        fmt(t.fouls), fmt(o.fouls))}
    </section>` : ""}

    ${statTable("Players", ["PTS","FG","3PT","FT","REB","AST","STL","BLK","TO","PF"], players)}

    ${!hasTeam && !players.length ? `<p class="empty">Stats for this game haven't been entered yet.</p>` : ""}`;
}

/* ── Box score: Play-by-Play tab ──────────────────────────── */
// "#11 layup" -> "<b>#11</b> Smith layup", so the data stays short and any
// name change flows through automatically.
const withNames = (t, year) => esc(t).replace(/#(\d+)/g, (m, n) => {
  const alt = year && wornByOther(year, n);
  if (alt) return `<b>#${n}</b> ${esc(alt.last)}`;
  return BY_NUM[n] ? `<b>#${n}</b> ${esc(BY_NUM[n].last)}` : `<b>#${n}</b>`;
});

const SCORE_TAG = { 1:"Free Throw", 2:"Basket", 3:"3-Pointer" };

function playRow(p, year, score) {
  const scored = p.pts > 0;
  const cls = ["play",
    scored && "is-score", p.opp && "is-opp", p.to && "is-turnover",
    p.miss && "is-miss", p.note && "is-note"].filter(Boolean).join(" ");
  const tag =
      scored  ? `<span class="play-tag sc">${SCORE_TAG[p.pts] || p.pts + " pts"}</span>`
    : p.to    ? `<span class="play-tag to">Turnover</span>`
    : p.stl   ? `<span class="play-tag ev">Steal</span>`
    : p.blk   ? `<span class="play-tag ev">Block</span>`
    : p.reb   ? `<span class="play-tag ev">Rebound</span>`
    : p.foul  ? `<span class="play-tag fl">Foul</span>`
    : p.miss  ? `<span class="play-tag ms">Miss</span>` : "";
  const chip  = scored ? `<span class="play-pts">+${p.pts}</span>` : "";
  const run   = scored ? `<span class="play-score">${score.us}–${score.them}</span>` : "";
  return `<li class="${cls}"><span class="play-txt">${withNames(p.t, year)}</span>${tag}${chip}${run}</li>`;
}

function playsView(g) {
  const quarters = (g.stats && g.stats.quarters) || [];
  if (!quarters.length) return `<p class="empty">No play-by-play recorded for this game.</p>`;
  const score = { us:0, them:0 };
  return `<div class="pbp">` + quarters.map((q, i) => {
    const rows = q.plays.map(pl => {
      if (pl.pts > 0) { if (pl.opp) score.them += pl.pts; else score.us += pl.pts; }
      return playRow(pl, g.year, score);
    }).join("");
    const n = q.n || i + 1;
    return `<section class="qtr">
      <div class="qtr-h">
        <span class="qtr-tag">${n <= 4 ? "Q" + n : qLabel(n - 1)}</span>
        <span class="qtr-n">${q.label || (n <= 4 ? qLabel(n - 1) + " Quarter" : "Overtime")}</span>
        <span class="qtr-note">${q.note ? esc(q.note) + " · " : ""}${score.us}–${score.them}</span>
      </div>
      <ol class="plays">${rows}</ol>
    </section>`;
  }).join("") + `</div>`;
}

/* ── Team stats (season) ──────────────────────────────────── */
const tblRow = (k, v) => `<div class="tbl-row"><span>${k}</span><b>${v}</b></div>`;

/* The headline categories. Each drives its leader card and the full ranked
   breakdown behind it, so the two can never disagree. */
const LEADER_CATS = {
  pts: { label:"Points",     table:"Scoring",    cols:["G","PTS","PPG","FG","3PT","FT"],
         pick:s => s.pts,
         vals:s => [s.gp, s.pts, per(s.pts, s.gp), ma(s.fgm, s.fga), ma(s.tpm, s.tpa), ma(s.ftm, s.fta)] },
  reb: { label:"Rebounds",   table:"Rebounding", cols:["G","REB","RPG","OFF","DEF"],
         pick:s => s.reb,
         vals:s => [s.gp, s.reb, per(s.reb, s.gp), fmt(s.oreb), fmt(s.dreb)] },
  ast: { label:"Assists",    table:"Assists",    cols:["G","AST","APG","TO"],
         pick:s => s.ast,
         vals:s => [s.gp, s.ast, per(s.ast, s.gp), fmt(s.to)] },
  stl: { label:"Steals",     table:"Steals",     cols:["G","STL","SPG"],
         pick:s => s.stl,
         vals:s => [s.gp, s.stl, per(s.stl, s.gp)] },
  blk: { label:"Blocks",     table:"Blocks",     cols:["G","BLK","BPG"],
         pick:s => s.blk,
         vals:s => [s.gp, s.blk, per(s.blk, s.gp)] },
  tpm: { label:"3-Pointers", table:"3-Pointers", cols:["G","3PM","3PA","3P%"],
         pick:s => s.tpm,
         vals:s => [s.gp, s.tpm, fmt(s.tpa), pct(s.tpm, s.tpa)] },
};

function leaderCard(key, games) {
  const cat = LEADER_CATS[key];
  const row = leaderBy(cat.pick, games);
  if (!row) return "";
  return `<button class="lead" data-leaders="${key}">
    <div class="lead-k">${cat.label}</div>
    <div class="lead-v">${row.v}</div>
    <div class="lead-p"><b>#${row.p.num}</b> ${esc(row.p.name)}</div>
    <span class="lead-go" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </button>`;
}

/* Full ranked breakdown behind a leader card. */
function leadersView(key, games) {
  const cat = LEADER_CATS[key];
  if (!cat) return `<p class="empty">Unknown category.</p>`;
  const year = games && games.length ? games[0].year : CURRENT.year;
  // Numbers worn by a different player that season are listed under that name.
  const extras = Object.keys(SEASON_JERSEYS[year] || {}).map(Number);
  const rows = [...new Set(ROSTER.map(pl => pl.num).concat(extras))]
    .map(num => ({ num, s: seasonStats2(num, games, year) }))
    .filter(r => r.s.gp > 0 && cat.pick(r.s) != null)
    .sort((a, b) => cat.pick(b.s) - cat.pick(a.s) || a.num - b.num)
    .map((r, i) => ({
      name: `<span class="rank">${i + 1}</span>${pName(r.num, year)}`,
      vals: cat.vals(r.s),
    }));

  return rows.length
    ? statTable(cat.table, cat.cols, rows)
    : `<p class="empty">No ${cat.table.toLowerCase()} recorded yet this season.</p>`;
}

function teamStatsView(games, label) {
  const t = teamSeason(games);
  const rec = games ? recordOf(games) : TEAM.record;
  if (!t.games) return `<p class="empty">No stats recorded yet for ${esc(label || TEAM.season)}.</p>`;
  const g = t.statGames;
  const n = t.qGames;

  return `
    <div class="modal-stats tstat-top">
      <div class="ms"><span>Record</span><b>${rec.w}–${rec.l}</b></div>
      <div class="ms"><span>Points For</span><b>${t.points}</b></div>
      <div class="ms"><span>Points Ag.</span><b>${t.pointsAgainst}</b></div>
    </div>

    <section class="bs-sec">
      <h3 class="bs-h">Team Leaders</h3>
      <div class="lead-grid">
        ${Object.keys(LEADER_CATS).map(k => leaderCard(k, games)).join("")}
      </div>
    </section>

    <section class="bs-sec">
      <h3 class="bs-h">Scoring</h3>
      <div class="tbl">
        ${tblRow("Points", t.points)}
        ${tblRow("Points per Game", per(t.points, t.games))}
        ${g ? tblRow("Field Goals", ma(t.fgm, t.fga)) : ""}
        ${g ? tblRow("&nbsp;&nbsp;FG %", pct(t.fgm, t.fga)) : ""}
        ${g ? tblRow("3-Pointers", ma(t.tpm, t.tpa)) : ""}
        ${g ? tblRow("Free Throws", ma(t.ftm, t.fta)) : ""}
        ${g ? tblRow("&nbsp;&nbsp;FT %", pct(t.ftm, t.fta)) : ""}
      </div>
    </section>

    ${g ? `
    <section class="bs-sec">
      <h3 class="bs-h">Rebounds &amp; Ball Control</h3>
      <div class="tbl">
        ${tblRow("Rebounds", t.reb)}
        ${tblRow("Rebounds per Game", per(t.reb, g))}
        ${tblRow("&nbsp;&nbsp;Offensive", t.oreb)}
        ${tblRow("&nbsp;&nbsp;Defensive", t.dreb)}
        ${tblRow("Assists", t.ast)}
        ${tblRow("Turnovers", t.to)}
        ${tblRow("Fouls", t.fouls)}
      </div>
    </section>` : ""}

    <section class="bs-sec">
      <h3 class="bs-h">Defense</h3>
      <div class="tbl">
        ${tblRow("Points Allowed", t.pointsAgainst)}
        ${tblRow("Allowed per Game", per(t.pointsAgainst, t.games))}
        ${g ? tblRow("Steals", t.stl) : ""}
        ${g ? tblRow("Blocks", t.blk) : ""}
      </div>
    </section>

    ${n ? `
    <section class="bs-sec">
      <h3 class="bs-h">Points by Quarter</h3>
      ${lineScore(t.qUs, t.qThem, "Opponents")}
    </section>` : ""}`;
}

/* ═══════════════════════════════════════════════════════════
   RENDER — views
   ═══════════════════════════════════════════════════════════ */
function visiblePlayers() {
  const s = state.q.trim().toLowerCase();
  return ROSTER
    .filter(p => {
      if (!s) return true;
      return p.name.toLowerCase().includes(s)
        || p.nickname.toLowerCase().includes(s)
        || p.position.toLowerCase().includes(s)
        || String(p.num).includes(s);
    })
    .sort((a, b) => state.sort === "num" ? a.num - b.num : a.last.localeCompare(b.last));
}

function render() {
  const tab = state.tab;

  // nav + tab bar
  const navTab = navTabFor(tab);
  document.querySelectorAll(".nav-item").forEach(b => {
    const on = b.dataset.tab === navTab;
    b.classList.toggle("is-active", on);
    b.setAttribute("aria-current", on ? "page" : "false");
  });

  // header copy
  const boxGame = state.box && gameById(state.box);
  const sn = state.season && seasonByYear(state.season);
  const snLabel = sn ? sn.label : "";
  $("#page-title").textContent =
    tab === "players"  ? "Meet the Team"
  : tab === "coaches"  ? "Coaching Staff"
  : tab === "menu"     ? "Menu"
  : tab === "seasons"  ? (boxGame ? `${TEAM.name} vs ${boxGame.opp}`
                          : state.leaders ? LEADER_CATS[state.leaders].label
                          : sn ? snLabel : "Past Seasons")
  : tab === "stats"    ? (state.leaders ? LEADER_CATS[state.leaders].label : "Team Stats")
  : boxGame            ? `${TEAM.name} vs ${boxGame.opp}`
  :                      "Game Schedule";
  $("#page-sub").textContent =
    tab === "players"  ? ""
  : tab === "coaches"  ? `${COACHES.length} coaches guiding the Saints`
  : tab === "menu"     ? "More from the Saints hub"
  : tab === "seasons"  ? (boxGame ? `Box score · ${fmtDate(boxGame.date, { month:"long", day:"numeric", year:"numeric" })}`
        : state.leaders ? `Every player · ${snLabel}`
        : sn ? "Schedule and team stats"
        : `${PAST_SEASONS.length} previous season${PAST_SEASONS.length === 1 ? "" : "s"}`)
  : tab === "stats"    ? (state.leaders
        ? `Every player · ${TEAM.season}`
        : `${TEAM.season} · ${PLAYED.length} game${PLAYED.length === 1 ? "" : "s"} played`)
  : boxGame            ? `Box score · ${fmtDate(boxGame.date)}`
  :                      `${TEAM.season} · ${PLAYED.length} of ${GAMES.length} games played`;

  // Breadcrumb: one element, retargeted to whatever we can back out of.
  const crumb = $("#crumb");
  const back =
      state.box      ? { attr:"data-back",         label:sn ? `${snLabel} schedule` : "All games" }
    : state.leaders  ? { attr:"data-back-leaders", label:sn ? `${snLabel} Team Stats` : "Team Stats" }
    : state.season   ? { attr:"data-back-season",  label:"Past Seasons" }
    : null;
  ["data-back", "data-back-leaders", "data-back-season"].forEach(a => crumb.removeAttribute(a));
  crumb.hidden = !back;
  if (back) { crumb.setAttribute(back.attr, "1"); $("#crumb-txt").textContent = back.label; }

  const film = $("#filmlink");
  if (boxGame && boxGame.video) { film.href = boxGame.video; film.hidden = false; }
  else film.hidden = true;

  $("#page-sub").hidden = !$("#page-sub").textContent;
  $("#searchwrap").hidden = tab !== "players";
  $("#toolbar").hidden = tab !== "players";
  $("#q-clear").hidden = !state.q;

  // toolbar state
  document.querySelectorAll("#sortgrp .segbtn").forEach(b =>
    b.classList.toggle("is-on", b.dataset.sort === state.sort));
  document.querySelectorAll("#menu .menu-item").forEach(b => {
    const on = b.dataset.style === state.style;
    b.classList.toggle("is-on", on);
    b.setAttribute("aria-checked", String(on));
  });

  // body
  const view = $("#view");
  if (tab === "players") {
    const list = visiblePlayers();
    view.innerHTML = placeholderNote("roster") + (list.length
      ? `<div class="grid">${list.map(playerCard).join("")}</div>`
      : `<p class="empty">No players match “${esc(state.q)}”.</p>`);
  } else if (tab === "coaches") {
    view.innerHTML = placeholderNote("coaching staff")
      + `<div class="grid grid-coach">${COACHES.map(coachCard).join("")}</div>`;
  } else if (tab === "stats") {
    view.innerHTML = state.leaders ? leadersView(state.leaders) : teamStatsView();
  } else if (tab === "menu") {
    view.innerHTML = menuView();
  } else if (tab === "seasons") {
    view.innerHTML =
        state.box               ? boxScoreView(state.box)
      : state.leaders && sn     ? leadersView(state.leaders, playedIn(sn.games))
      : sn                      ? seasonDetailView(state.season)
      :                           seasonsView();
  } else if (state.box) {
    view.innerHTML = boxScoreView(state.box);
  } else {
    view.innerHTML = placeholderNote("schedule")
      + `<div class="sched">${GAMES.map(gameRow).join("")}</div>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   DETAIL SHEET
   ═══════════════════════════════════════════════════════════ */
let lastFocus = null;

// Season stat groups on the full card. A tile is only drawn when the player
// actually has that number, so nothing shows an empty box.
const STAT_GROUPS = [
  { label:"Scoring", tiles:(s) => [
      ["Points", s.pts], ["PPG", s.pts != null ? per(s.pts, s.gp) : null],
      ["FG", (s.fgm != null || s.fga != null) ? ma(s.fgm, s.fga) : null],
      ["FG %", s.fga ? pct(s.fgm, s.fga) : null],
      ["3PT", (s.tpm != null || s.tpa != null) ? ma(s.tpm, s.tpa) : null],
      ["FT", (s.ftm != null || s.fta != null) ? ma(s.ftm, s.fta) : null] ] },
  { label:"Rebounding", tiles:(s) => [
      ["Rebounds", s.reb], ["RPG", s.reb != null ? per(s.reb, s.gp) : null],
      ["Offensive", s.oreb], ["Defensive", s.dreb] ] },
  { label:"Playmaking & Defense", tiles:(s) => [
      ["Assists", s.ast], ["Steals", s.stl], ["Blocks", s.blk], ["Turnovers", s.to] ] },
  { label:"Fouls", tiles:(s) => [
      ["Fouls", s.fouls], ["Per Game", s.fouls != null ? per(s.fouls, s.gp) : null] ] },
];

function statsSection(st, name) {
  const groups = !st.gp ? "" : STAT_GROUPS
    .map(g => {
      const tiles = g.tiles(st)
        .filter(([, val]) => val !== undefined && val !== null && !Number.isNaN(val))
        .map(([k, val]) => `<div class="st"><span>${k}</span><b>${val}</b></div>`)
        .join("");
      return tiles ? `<div class="statgrp">
        <div class="statgrp-h">${g.label}</div>
        <div class="statrow">${tiles}</div>
      </div>` : "";
    }).join("");

  return `<section class="stats">
    <div class="stats-h">
      <h3>Season Stats</h3>
      <span>${TEAM.season} · ${st.gp} of ${PLAYED.length} game${PLAYED.length === 1 ? "" : "s"} played</span>
    </div>
    ${groups || `<p class="stats-empty">No stats recorded for ${esc(name)} yet this season.</p>`}
  </section>`;
}

function openPlayer(id) {
  const p = ROSTER.find(x => x.id === id);
  if (!p) return;
  lastFocus = document.activeElement;

  $("#modal-photo").className = "modal-photo photo-host";
  $("#modal-photo").innerHTML = `
    <div class="modal-bg"></div>
    <div class="modal-hex" aria-hidden="true"></div>
    <div class="ph" aria-hidden="true"><span class="ph-mono">${initials(p)}</span></div>
    ${img(p.photo, p.name, "")}
    <div class="modal-shade"></div>
    <div class="modal-num">${p.num}</div>
    <div class="modal-plate">
      <div class="modal-nick">“${esc(p.nickname)}”</div>
      <div class="modal-name" id="modal-name">${esc(p.first)} <b>${esc(p.last)}</b></div>
    </div>`;

  const st = seasonStats(p.num);
  $("#modal-info").innerHTML = `
    <div class="modal-pos">${p.position}</div>
    <div class="modal-stats">
      <div class="ms"><span>Jersey</span><b>#${p.num}</b></div>
      <div class="ms ms-pos"><span>Positions</span><b>${p.position}</b></div>
      <div class="ms"><span>Games</span><b>${st.gp}</b></div>
    </div>
    <div class="modal-fact">
      <div class="modal-fact-h">Fun fact</div>
      <p>${esc(p.fact)}</p>
    </div>
    ${statsSection(st, p.first)}
    ${careerSection(p)}`;

  $("#modal").hidden = false;
  document.body.classList.add("is-locked");
  $("#modal-x").focus();
}

function closePlayer() {
  $("#modal").hidden = true;
  document.body.classList.remove("is-locked");
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
}

/* ═══════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════ */
// Tapping the tab you're already on returns it to its root view, rather
// than leaving a box score or breakdown open underneath.
function goTab(id) {
  if (!TABS.includes(id)) return;
  state.tab = id;
  state.box = null;
  state.leaders = null;
  state.season = null;
  state.seasonTab = "schedule";
  history.replaceState(null, "", location.search + "#" + id);
  render();
  $("#main").scrollIntoView({ block: "start" });
  window.scrollTo(0, 0);
}

let menuOpen = false;
function setMenu(open) {
  menuOpen = open;
  $("#menu").hidden = !open;
  $("#menu-btn").setAttribute("aria-expanded", String(open));
  $("#menu-btn").classList.toggle("is-on", open);
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#menu-btn")) { setMenu(!menuOpen); return; }
  if (menuOpen && !e.target.closest("#menu")) setMenu(false);

  const nav = e.target.closest("[data-tab]");
  if (nav) return goTab(nav.dataset.tab);

  // Schedule → box score, and back again.
  const box = e.target.closest("[data-box]");
  if (box) { state.box = Number(box.dataset.box); state.boxTab = "stats"; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back]")) { state.box = null; render(); window.scrollTo(0, 0); return; }

  const sea = e.target.closest("[data-season]");
  if (sea) { state.season = Number(sea.dataset.season); state.seasonTab = "schedule"; state.leaders = null; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back-season]")) { state.season = null; state.leaders = null; render(); window.scrollTo(0, 0); return; }

  const stab = e.target.closest("[data-seasontab]");
  if (stab) { state.seasonTab = stab.dataset.seasontab; render(); return; }

  const ld = e.target.closest("[data-leaders]");
  if (ld) { state.leaders = ld.dataset.leaders; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back-leaders]")) { state.leaders = null; render(); window.scrollTo(0, 0); return; }

  const bt = e.target.closest("[data-boxtab]");
  if (bt) { state.boxTab = bt.dataset.boxtab; render(); return; }

  const sort = e.target.closest("[data-sort]");
  if (sort) { state.sort = sort.dataset.sort; return render(); }

  const style = e.target.closest("[data-style]");
  if (style) {
    state.style = style.dataset.style;
    try { localStorage.setItem(LS_KEY, state.style); } catch (err) { /* private mode */ }
    setMenu(false);
    return render();
  }

  // "View full card" sits on the flipped back — handle it before the flip.
  const open = e.target.closest("[data-open]");
  if (open) { e.stopPropagation(); return openPlayer(Number(open.dataset.open)); }

  const card = e.target.closest("[data-flip]");
  if (card) flipCard(card);
});

function flipCard(card) {
  const id = Number(card.dataset.flip);
  const nowFlipped = !state.flipped.has(id);
  nowFlipped ? state.flipped.add(id) : state.flipped.delete(id);
  card.classList.toggle("is-flipped", nowFlipped);
  card.setAttribute("aria-pressed", String(nowFlipped));
  // inert keeps the face that's turned away out of the tab order and the
  // accessibility tree — backface-visibility alone still leaves it focusable.
  card.querySelector(".tc-front").inert = nowFlipped;
  card.querySelector(".tc-back").inert = !nowFlipped;
}

// The card shell is a div with role=button, so Enter/Space need wiring by hand.
$("#view").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest("[data-flip]");
  if (!card || card !== e.target) return;
  e.preventDefault();
  flipCard(card);
});

$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#q-clear").addEventListener("click", () => {
  state.q = ""; $("#q").value = ""; render(); $("#q").focus();
});

$("#modal-x").addEventListener("click", closePlayer);
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closePlayer(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("#modal").hidden) closePlayer();
  else if (menuOpen) { setMenu(false); $("#menu-btn").focus(); }
});

window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (TABS.includes(h)) goTab(h);
});

/* ═══════════════════════════════════════════════════════════ */
/* ── PASSWORD GATE ─────────────────────────────────────────────
   Deliberately lightweight: the code lives in this file, so it keeps casual
   visitors out, nothing more. Don't put anything genuinely private behind it. */
const GATE_CODE = "1985";
const GATE_KEY  = "shiloh-bb.gate";   // must match the pre-paint check in <head>

(function initGate() {
  const gate = $("#gate"), form = $("#gate-form"), err = $("#gate-err");
  const pin = $("#pin"), boxes = [...pin.querySelectorAll("input")];

  const unlock = () => {
    try { localStorage.setItem(GATE_KEY, "ok"); } catch (e) { /* private mode */ }
    document.documentElement.classList.add("unlocked");
    gate.setAttribute("hidden", "");
  };

  const fail = (msg) => {
    err.textContent = msg;
    pin.classList.add("is-bad");
    setTimeout(() => pin.classList.remove("is-bad"), 400);
    boxes.forEach(b => { b.value = ""; });
    boxes[0].focus();
  };

  const submit = () => {
    const code = boxes.map(b => b.value).join("");
    if (code.length < 4) return fail("Enter all four digits.");
    if (code === GATE_CODE) unlock();
    else fail("That code isn't right. Try again.");
  };

  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/\D/g, "").slice(0, 1);
      err.textContent = "";
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      if (boxes.every(b => b.value)) submit();          // auto-submit on the 4th digit
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
      if (e.key === "ArrowLeft"  && i > 0) boxes[i - 1].focus();
      if (e.key === "ArrowRight" && i < boxes.length - 1) boxes[i + 1].focus();
    });
    // Let a pasted code fill the whole row.
    box.addEventListener("paste", (e) => {
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach((d, n) => { if (boxes[n]) boxes[n].value = d; });
      boxes[Math.min(digits.length, 3)].focus();
      if (boxes.every(b => b.value)) submit();
    });
  });

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });

  if (!document.documentElement.classList.contains("unlocked")) boxes[0].focus();
  else gate.setAttribute("hidden", "");
})();

renderChrome();
render();
probePhotos();
auditGames();
</script>
