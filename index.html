  if (!PAST_SEASONS.length) return `<p class="empty">No previous seasons yet — this is the first one.</p>`;
  return `<div class="mlist">${PAST_SEASONS.map(sn => {
    const rec = recordOf(sn.games);
    const played = playedIn(sn.games).length;
    const sub = played
      ? `${rec.w}–${rec.l} · ${played} game${played === 1 ? "" : "s"}`
      : `${sn.games.length} games · stats not entered yet`;
    return `<button class="mrow" data-season="${sn.year}">
      <span class="mrow-yr">${esc(sn.short || sn.year)}</span>
      <span class="mrow-txt"><b>${esc(sn.label)}</b><span>${sub}</span></span>
      <svg class="mrow-go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>`;
  }).join("")}</div>`;
}

function seasonDetailView(year) {
  const sn = seasonByYear(year);
  if (!sn) return `<p class="empty">Unknown season.</p>`;
  const tab = state.seasonTab;
  return `
    <div class="bstabs" role="tablist">
      <button class="bstab ${tab === "schedule" ? "is-on" : ""}" data-seasontab="schedule"
              role="tab" aria-selected="${tab === "schedule"}">Schedule</button>
      <button class="bstab ${tab === "stats" ? "is-on" : ""}" data-seasontab="stats"
              role="tab" aria-selected="${tab === "stats"}">Team Stats</button>
    </div>
    ${tab === "stats"
      ? teamStatsView(playedIn(sn.games), sn.label)
      : `<div class="sched">${sn.games.map(gameRow).join("")}</div>`}`;
}

/* ── Box score (one game) ─────────────────────────────────── */
// Renders a stat table only when at least one player has a line in it.
function statTable(title, cols, rows) {
  if (!rows.length) return "";
  return `<div class="pstat">
    <div class="pstat-h">${title}</div>
    <div class="pstat-scroll">
      <table>
        <thead><tr><th class="pstat-name">Player</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr><td class="pstat-name">${r.name}</td>${
          r.vals.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

const pName = (num, year) => {
  const alt = year && wornByOther(year, num);
  if (alt) return `<b>${num}</b> ${esc(alt.last)}`;
  const p = BY_NUM[num];
  return p ? `<b>${p.num}</b> ${esc(p.last)}` : `<b>${num}</b>`;
};

const QLABEL = ["1st", "2nd", "3rd", "4th", "OT", "2OT", "3OT"];
const qLabel = (i) => QLABEL[i] || `${i - 3}OT`;

// Points by quarter for one game or a whole season.
function lineScore(us, them, opp, totals) {
  const n = Math.max(us.length, them.length);
  const cells = (arr) => Array.from({ length: n }, (_, i) => `<td>${arr[i] ?? dash}</td>`).join("");
  const sum = (arr) => arr.reduce((a, b) => a + (b || 0), 0);
  const tUs = totals ? totals[0] : sum(us), tThem = totals ? totals[1] : sum(them);
  return `<div class="linescore">
    <table>
      <thead><tr><th class="ls-team"></th>${Array.from({ length: n }, (_, i) => `<th>${qLabel(i)}</th>`).join("")}<th>T</th></tr></thead>
      <tbody>
        <tr class="${tUs >= tThem ? "is-win" : "is-lose"}"><td class="ls-team">${TEAM.name}</td>${cells(us)}<td class="ls-tot">${tUs}</td></tr>
        <tr class="${tThem > tUs ? "is-win" : "is-lose"}"><td class="ls-team">${esc(opp)}</td>${cells(them)}<td class="ls-tot">${tThem}</td></tr>
      </tbody>
    </table>
  </div>`;
}

function boxScoreView(id) {
  const g = gameById(id);
  if (!g || g.us == null) return `<p class="empty">No box score for that game yet.</p>`;
  const won = g.us > g.them;
  const hasPlays = !!(g.stats && g.stats.quarters && g.stats.quarters.length);
  const tab = hasPlays ? state.boxTab : "stats";

  const head = `
    <div class="bs-head">
      <div class="bs-meta">Final · ${fmtDate(g.date, { weekday:"long", month:"long", day:"numeric", year:"numeric" })}</div>
      <div class="bs-line ${won ? "is-win" : ""}">
        <span class="bs-team">${TEAM.name}${g.home ? "" : " (away)"}</span>
        <span class="bs-score">${g.us}</span>
      </div>
      <div class="bs-line ${won ? "" : "is-win"}">
        <span class="bs-team">${esc(g.opp)}</span>
        <span class="bs-score">${g.them}</span>
      </div>
    </div>`;

  const tabs = hasPlays ? `
    <div class="bstabs" role="tablist">
      <button class="bstab ${tab === "stats" ? "is-on" : ""}" data-boxtab="stats"
              role="tab" aria-selected="${tab === "stats"}">Box Score</button>
      <button class="bstab ${tab === "plays" ? "is-on" : ""}" data-boxtab="plays"
              role="tab" aria-selected="${tab === "plays"}">Play-by-Play</button>
    </div>` : "";

  return head + tabs + (tab === "plays" ? playsView(g) : boxStatsView(g));
}

/* ── Box score: stats tab ─────────────────────────────────── */
function boxStatsView(g) {
  const s = g.stats || {};
  const t = teamLine(g);
  const o = lineOf((s.team && s.team.opp) || {});
  const q = s.team && s.team.quarters;
  const hasTeam = KEYS.some(k => t[k] != null);

  const players = Object.keys(s.players || {}).map(Number)
    .map(n => ({ n, v: lineOf(s.players[n]) }))
    .sort((a, b) => (b.v.pts || 0) - (a.v.pts || 0) || a.n - b.n)
    .map(({ n, v }) => ({ name: pName(n, g.year),
      vals: [v.pts || 0, ma(v.fgm, v.fga), ma(v.tpm, v.tpa), ma(v.ftm, v.fta),
             fmt(v.reb), fmt(v.ast), fmt(v.stl), fmt(v.blk), fmt(v.to), fmt(v.fouls)] }));

  const cmp = (label, a, b) => `<div class="cmp"><span>${a}</span><em>${label}</em><span>${b}</span></div>`;

  return `
    ${q && q.us ? `<section class="bs-sec"><h3 class="bs-h">Scoring by Quarter</h3>${
        lineScore(q.us, q.them || [], g.opp, [g.us, g.them])}</section>` : ""}

    ${hasTeam ? `
    <section class="bs-sec">
      <h3 class="bs-h">Team Stats</h3>
      <div class="cmp-head"><span>${TEAM.name}</span><em></em><span>${esc(g.opp)}</span></div>
      ${cmp("Field Goals",  ma(t.fgm, t.fga), ma(o.fgm, o.fga))}
      ${cmp("FG %",         t.fga ? pct(t.fgm, t.fga) : dash, o.fga ? pct(o.fgm, o.fga) : dash)}
      ${cmp("3-Pointers",   ma(t.tpm, t.tpa), ma(o.tpm, o.tpa))}
      ${cmp("Free Throws",  ma(t.ftm, t.fta), ma(o.ftm, o.fta))}
      ${cmp("Rebounds",     fmt(t.reb), fmt(o.reb))}
      ${cmp("Assists",      fmt(t.ast), fmt(o.ast))}
      ${cmp("Steals",       fmt(t.stl), fmt(o.stl))}
      ${cmp("Blocks",       fmt(t.blk), fmt(o.blk))}
      ${cmp("Turnovers",    fmt(t.to),  fmt(o.to))}
      ${cmp("Fouls",        fmt(t.fouls), fmt(o.fouls))}
    </section>` : ""}

    ${statTable("Players", ["PTS","FG","3PT","FT","REB","AST","STL","BLK","TO","PF"], players)}

    ${!hasTeam && !players.length ? `<p class="empty">Stats for this game haven't been entered yet.</p>` : ""}`;
}

/* ── Box score: Play-by-Play tab ──────────────────────────── */
// "#11 layup" -> "<b>#11</b> Smith layup", so the data stays short and any
// name change flows through automatically.
const withNames = (t, year) => esc(t).replace(/#(\d+)/g, (m, n) => {
  const alt = year && wornByOther(year, n);
  if (alt) return `<b>#${n}</b> ${esc(alt.last)}`;
  return BY_NUM[n] ? `<b>#${n}</b> ${esc(BY_NUM[n].last)}` : `<b>#${n}</b>`;
});

const SCORE_TAG = { 1:"Free Throw", 2:"Basket", 3:"3-Pointer" };

function playRow(p, year, score) {
  const scored = p.pts > 0;
  const cls = ["play",
    scored && "is-score", p.opp && "is-opp", p.to && "is-turnover",
    p.miss && "is-miss", p.note && "is-note"].filter(Boolean).join(" ");
  const tag =
      scored  ? `<span class="play-tag sc">${SCORE_TAG[p.pts] || p.pts + " pts"}</span>`
    : p.to    ? `<span class="play-tag to">Turnover</span>`
    : p.stl   ? `<span class="play-tag ev">Steal</span>`
    : p.blk   ? `<span class="play-tag ev">Block</span>`
    : p.reb   ? `<span class="play-tag ev">Rebound</span>`
    : p.foul  ? `<span class="play-tag fl">Foul</span>`
    : p.miss  ? `<span class="play-tag ms">Miss</span>` : "";
  const chip  = scored ? `<span class="play-pts">+${p.pts}</span>` : "";
  const run   = scored ? `<span class="play-score">${score.us}–${score.them}</span>` : "";
  return `<li class="${cls}"><span class="play-txt">${withNames(p.t, year)}</span>${tag}${chip}${run}</li>`;
}

function playsView(g) {
  const quarters = (g.stats && g.stats.quarters) || [];
  if (!quarters.length) return `<p class="empty">No play-by-play recorded for this game.</p>`;
  const score = { us:0, them:0 };
  return `<div class="pbp">` + quarters.map((q, i) => {
    const rows = q.plays.map(pl => {
      if (pl.pts > 0) { if (pl.opp) score.them += pl.pts; else score.us += pl.pts; }
      return playRow(pl, g.year, score);
    }).join("");
    const n = q.n || i + 1;
    return `<section class="qtr">
      <div class="qtr-h">
        <span class="qtr-tag">${n <= 4 ? "Q" + n : qLabel(n - 1)}</span>
        <span class="qtr-n">${q.label || (n <= 4 ? qLabel(n - 1) + " Quarter" : "Overtime")}</span>
        <span class="qtr-note">${q.note ? esc(q.note) + " · " : ""}${score.us}–${score.them}</span>
      </div>
      <ol class="plays">${rows}</ol>
    </section>`;
  }).join("") + `</div>`;
}

/* ── Team stats (season) ──────────────────────────────────── */
const tblRow = (k, v) => `<div class="tbl-row"><span>${k}</span><b>${v}</b></div>`;

/* The headline categories. Each drives its leader card and the full ranked
   breakdown behind it, so the two can never disagree. */
const LEADER_CATS = {
  pts: { label:"Points",     table:"Scoring",    cols:["G","PTS","PPG","FG","3PT","FT"],
         pick:s => s.pts,
         vals:s => [s.gp, s.pts, per(s.pts, s.gp), ma(s.fgm, s.fga), ma(s.tpm, s.tpa), ma(s.ftm, s.fta)] },
  reb: { label:"Rebounds",   table:"Rebounding", cols:["G","REB","RPG","OFF","DEF"],
         pick:s => s.reb,
         vals:s => [s.gp, s.reb, per(s.reb, s.gp), fmt(s.oreb), fmt(s.dreb)] },
  ast: { label:"Assists",    table:"Assists",    cols:["G","AST","APG","TO"],
         pick:s => s.ast,
         vals:s => [s.gp, s.ast, per(s.ast, s.gp), fmt(s.to)] },
  stl: { label:"Steals",     table:"Steals",     cols:["G","STL","SPG"],
         pick:s => s.stl,
         vals:s => [s.gp, s.stl, per(s.stl, s.gp)] },
  blk: { label:"Blocks",     table:"Blocks",     cols:["G","BLK","BPG"],
         pick:s => s.blk,
         vals:s => [s.gp, s.blk, per(s.blk, s.gp)] },
  tpm: { label:"3-Pointers", table:"3-Pointers", cols:["G","3PM","3PA","3P%"],
         pick:s => s.tpm,
         vals:s => [s.gp, s.tpm, fmt(s.tpa), pct(s.tpm, s.tpa)] },
};

function leaderCard(key, games) {
  const cat = LEADER_CATS[key];
  const row = leaderBy(cat.pick, games);
  if (!row) return "";
  return `<button class="lead" data-leaders="${key}">
    <div class="lead-k">${cat.label}</div>
    <div class="lead-v">${row.v}</div>
    <div class="lead-p"><b>#${row.p.num}</b> ${esc(row.p.name)}</div>
    <span class="lead-go" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </button>`;
}

/* Full ranked breakdown behind a leader card. */
function leadersView(key, games) {
  const cat = LEADER_CATS[key];
  if (!cat) return `<p class="empty">Unknown category.</p>`;
  const year = games && games.length ? games[0].year : CURRENT.year;
  // Numbers worn by a different player that season are listed under that name.
  const extras = Object.keys(SEASON_JERSEYS[year] || {}).map(Number);
  const rows = [...new Set(ROSTER.map(pl => pl.num).concat(extras))]
    .map(num => ({ num, s: seasonStats2(num, games, year) }))
    .filter(r => r.s.gp > 0 && cat.pick(r.s) != null)
    .sort((a, b) => cat.pick(b.s) - cat.pick(a.s) || a.num - b.num)
    .map((r, i) => ({
      name: `<span class="rank">${i + 1}</span>${pName(r.num, year)}`,
      vals: cat.vals(r.s),
    }));

  return rows.length
    ? statTable(cat.table, cat.cols, rows)
    : `<p class="empty">No ${cat.table.toLowerCase()} recorded yet this season.</p>`;
}

function teamStatsView(games, label) {
  const t = teamSeason(games);
  const rec = games ? recordOf(games) : TEAM.record;
  if (!t.games) return `<p class="empty">No stats recorded yet for ${esc(label || TEAM.season)}.</p>`;
  const g = t.statGames;
  const n = t.qGames;

  return `
    <div class="modal-stats tstat-top">
      <div class="ms"><span>Record</span><b>${rec.w}–${rec.l}</b></div>
      <div class="ms"><span>Points For</span><b>${t.points}</b></div>
      <div class="ms"><span>Points Ag.</span><b>${t.pointsAgainst}</b></div>
    </div>

    <section class="bs-sec">
      <h3 class="bs-h">Team Leaders</h3>
      <div class="lead-grid">
        ${Object.keys(LEADER_CATS).map(k => leaderCard(k, games)).join("")}
      </div>
    </section>

    <section class="bs-sec">
      <h3 class="bs-h">Scoring</h3>
      <div class="tbl">
        ${tblRow("Points", t.points)}
        ${tblRow("Points per Game", per(t.points, t.games))}
        ${g ? tblRow("Field Goals", ma(t.fgm, t.fga)) : ""}
        ${g ? tblRow("&nbsp;&nbsp;FG %", pct(t.fgm, t.fga)) : ""}
        ${g ? tblRow("3-Pointers", ma(t.tpm, t.tpa)) : ""}
        ${g ? tblRow("Free Throws", ma(t.ftm, t.fta)) : ""}
        ${g ? tblRow("&nbsp;&nbsp;FT %", pct(t.ftm, t.fta)) : ""}
      </div>
    </section>

    ${g ? `
    <section class="bs-sec">
      <h3 class="bs-h">Rebounds &amp; Ball Control</h3>
      <div class="tbl">
        ${tblRow("Rebounds", t.reb)}
        ${tblRow("Rebounds per Game", per(t.reb, g))}
        ${tblRow("&nbsp;&nbsp;Offensive", t.oreb)}
        ${tblRow("&nbsp;&nbsp;Defensive", t.dreb)}
        ${tblRow("Assists", t.ast)}
        ${tblRow("Turnovers", t.to)}
        ${tblRow("Fouls", t.fouls)}
      </div>
    </section>` : ""}

    <section class="bs-sec">
      <h3 class="bs-h">Defense</h3>
      <div class="tbl">
        ${tblRow("Points Allowed", t.pointsAgainst)}
        ${tblRow("Allowed per Game", per(t.pointsAgainst, t.games))}
        ${g ? tblRow("Steals", t.stl) : ""}
        ${g ? tblRow("Blocks", t.blk) : ""}
      </div>
    </section>

    ${n ? `
    <section class="bs-sec">
      <h3 class="bs-h">Points by Quarter</h3>
      ${lineScore(t.qUs, t.qThem, "Opponents")}
    </section>` : ""}`;
}

/* ── Practice builder ─────────────────────────────────────────
   Coaches assemble their own plan from the drill library. Saved plans live
   in this browser (localStorage) and can be shared as a link that carries
   the whole plan in the URL, so nothing needs a server. */
const CUSTOM_KEY = "shiloh-bb.practices";
const DRAFT_KEY  = "shiloh-bb.practiceDraft";
const TARGET_MIN = 60;

const validPlan = (p) => !!p && typeof p.title === "string" && Array.isArray(p.blocks)
  && p.blocks.length > 0 && p.blocks.every(b => DRILLS[b.drill] && b.min > 0);
const lsGet = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } };

let CUSTOM = (lsGet(CUSTOM_KEY, []) || []).filter(validPlan);
const saveCustom = () => lsSet(CUSTOM_KEY, CUSTOM);
const newId = () => "c" + Date.now().toString(36);

/* Season plans are editable too. A coach's changes to a stock plan are kept
   as an override in this browser (EDITS), a deleted stock plan is hidden
   (HIDDEN) rather than lost, and the list order is remembered (ORDER). */
const EDITS_KEY  = "shiloh-bb.planEdits";
const HIDDEN_KEY = "shiloh-bb.planHidden";
const ORDER_KEY  = "shiloh-bb.planOrder";
let EDITS  = lsGet(EDITS_KEY, {}) || {};
let HIDDEN = (lsGet(HIDDEN_KEY, []) || []).filter(id => PRACTICES.some(p => p.id === id));
let ORDER  = lsGet(ORDER_KEY, []) || [];
const savePlanState = () => { lsSet(EDITS_KEY, EDITS); lsSet(HIDDEN_KEY, HIDDEN); lsSet(ORDER_KEY, ORDER); };

// A stock plan with any local edit laid over it.
function stockPlan(id) {
  const base = PRACTICES.find(p => p.id === id);
  if (!base) return null;
  const e = EDITS[id];
  return e && validPlan(e)
    ? Object.assign({}, base, e, { id, stock:true, edited:true })
    : Object.assign({}, base, { stock:true, edited:false });
}

// Every visible plan, in the coach's order. Until the coach reorders,
// coach-made plans come first (newest on top), then the season plans in
// sequence.
function allPlans() {
  const mine = [...CUSTOM].sort((a, b) => (b.updated || "").localeCompare(a.updated || ""))
    .map(p => Object.assign({}, p, { custom:true }));
  const stock = PRACTICES.filter(p => !HIDDEN.includes(p.id)).map(p => stockPlan(p.id));
  // Not yet placed: a new coach-made plan goes to the top, a restored season plan to the end.
  const pos = (id) => { const i = ORDER.indexOf(id); return i >= 0 ? i : (typeof id === "number" ? Infinity : -1); };
  return mine.concat(stock).map((p, i) => ({ p, i }))
    .sort((a, b) => (pos(a.p.id) - pos(b.p.id)) || (a.i - b.i)).map(x => x.p);
}

// Move a plan one step among the plans currently shown.
function movePlan(id, dir) {
  const shown = visiblePlans().map(p => p.id);
  const i = shown.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= shown.length) return;
  ORDER = allPlans().map(p => p.id);             // freeze the full order first
  const from = ORDER.indexOf(id), to = ORDER.indexOf(shown[j]);
  ORDER.splice(from, 1);
  ORDER.splice(to, 0, id);
  savePlanState();
}

function visiblePlans() {
  const f = state.planFilter;
  return allPlans().filter(p => f === "all" || (f === "mine" ? p.custom : p.stock));
}


// A plan in the compact form that travels in a share link.
const encodePlan = (p) => {
  const j = JSON.stringify({ t:p.title, d:p.date || "", g:p.goal || "",
    b:p.blocks.map(b => [b.drill, b.min, b.note || ""]) });
  return btoa(unescape(encodeURIComponent(j))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const decodePlan = (s) => {
  try {
    const j = decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
    const o = JSON.parse(j);
    const p = { id:"shared", custom:true, shared:true,
      title: String(o.t || "Shared practice").slice(0, 80),
      date: /^\d{4}-\d{2}-\d{2}$/.test(o.d || "") ? o.d : null,
      goal: String(o.g || "").slice(0, 400),
      blocks: (Array.isArray(o.b) ? o.b : []).map(x => ({
        drill:String(x[0]), min:Math.max(1, Math.min(120, Math.round(Number(x[1]) || 0))), note:String(x[2] || "").slice(0, 400) })) };
    return validPlan(p) ? p : null;
  } catch (e) { return null; }
};
const shareUrl = (p) => location.origin + location.pathname + "?plan=" + encodePlan(p) + "#practice";

// A blank draft, or a copy of an existing plan to customize.
const blankDraft = (from, copy) => ({
  id: from && !from.shared && !copy ? from.id : null,
  title: from ? (from.shared || copy ? from.title + " (copy)" : from.title) : "",
  date: from ? from.date : null,
  goal: from ? from.goal || "" : "",
  blocks: from ? from.blocks.map(b => ({ drill:b.drill, min:b.min, note:b.note || "" })) : [],
});
const draftMinutes = (d) => d.blocks.reduce((n, b) => n + (Number(b.min) || 0), 0);
const saveDraft = () => lsSet(DRAFT_KEY, state.builder);

function openBuilder(from, copy) {
  state.builder = blankDraft(from, copy);
  state.practice = null; state.shared = null;
  saveDraft();
  render(); window.scrollTo(0, 0);
}

function builderView() {
  const d = state.builder;
  const total = draftMinutes(d);
  const cls = total === TARGET_MIN ? "is-full" : total > TARGET_MIN ? "is-over" : "";
  const left = TARGET_MIN - total;
  let at = 0;
  const rows = d.blocks.map((b, i) => {
    const dr = DRILLS[b.drill];
    const row = `<div class="bblk">
      <div class="blk-when"><span class="blk-at">${clock(at)}</span></div>
      <div class="blk-body">
        <div class="bblk-top">
          ${catChip(dr.cat)}<span class="blk-name">${esc(dr.name)}</span>
          <button class="iconbtn del" data-bdel="${i}" aria-label="Remove ${esc(dr.name)}">×</button>
        </div>
        <div class="bblk-ctl">
          <span class="stepper">
            <button type="button" data-bmin="${i}:-1" aria-label="One minute less">−</button>
            <input type="number" inputmode="numeric" min="1" max="120" value="${b.min}" data-bminput="${i}" aria-label="Minutes" />
            <button type="button" data-bmin="${i}:1" aria-label="One minute more">+</button>
          </span><span class="stepper-l">min</span>
          <span class="bblk-move">
            <button class="iconbtn" data-bmove="${i}:-1" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
            <button class="iconbtn" data-bmove="${i}:1" ${i === d.blocks.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
          </span>
        </div>
        <textarea data-bnote="${i}" placeholder="Coach note (optional)" rows="1">${esc(b.note || "")}</textarea>
      </div>
    </div>`;
    at += Number(b.min) || 0;
    return row;
  }).join("");

  return `<div class="bld">
    <div class="fld-row">
      <label class="fld"><span>Practice name</span>
        <input id="b-title" type="text" maxlength="80" placeholder="e.g. Tuesday — Defense" value="${esc(d.title)}" /></label>
      <label class="fld"><span>Date</span>
        <input id="b-date" type="date" value="${d.date || ""}" /></label>
    </div>
    <label class="fld"><span>Goal for the night</span>
      <textarea id="b-goal" maxlength="400" placeholder="What should the kids walk away with?">${esc(d.goal || "")}</textarea></label>

    <div class="bar-wrap ${cls}">
      <div class="bar"><div class="bar-fill" style="width:${Math.min(100, total / TARGET_MIN * 100)}%"></div></div>
      <div class="bar-txt"><span><b>${total}</b> of ${TARGET_MIN} minutes</span>
        <span>${left > 0 ? left + " to go" : left === 0 ? "Right on time" : (-left) + " over"}</span></div>
    </div>

    ${rows || `<div class="bld-empty">No drills yet. Add one from the library to start the clock.</div>`}

    <button class="btn wide" data-pick>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add a drill from the library
    </button>

    <div class="bld-foot">
      <button class="btn" data-bsave ${d.blocks.length ? "" : "disabled"}>Save practice</button>
      <button class="btn ghost" data-bcancel>${d.id ? "Discard changes" : "Discard"}</button>
    </div>
  </div>`;
}

/* Drill picker sheet — search + category chips over the whole library. */
function pickerListHtml() {
  const q = state.picker.q.trim().toLowerCase();
  const cat = state.picker.cat;
  const inDraft = new Set(state.builder.blocks.map(b => b.drill));
  const list = Object.keys(DRILLS).map(k => ({ k, d:DRILLS[k] }))
    .filter(({ d }) => (cat === "all" || d.cat === cat)
      && (!q || d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || CATS[d.cat].toLowerCase().includes(q)))
    .sort((a, b) => a.d.cat === b.d.cat ? a.d.name.localeCompare(b.d.name)
      : Object.keys(CATS).indexOf(a.d.cat) - Object.keys(CATS).indexOf(b.d.cat));
  if (!list.length) return `<p class="empty">No drills match “${esc(state.picker.q)}”.</p>`;
  return list.map(({ k, d }) => `<div class="pick">
    <div class="pick-txt">
      <div class="pick-name">${esc(d.name)}</div>
      <div class="pick-sub">${catChip(d.cat)} ${SOURCES[d.src]}</div>
    </div>
    <button class="pick-add${inDraft.has(k) ? " is-added" : ""}" data-pkadd="${k}">${inDraft.has(k) ? "Add again" : "Add"}</button>
  </div>`).join("");
}

function renderPicker() {
  const sheet = $("#sheet");
  if (!state.picker.open) { sheet.hidden = true; return; }
  const d = state.builder;
  sheet.innerHTML = `<div class="sheet-card" role="dialog" aria-modal="true" aria-label="Add a drill">
    <button class="modal-x" data-pkdone aria-label="Done">×</button>
    <div class="sheet-h">
      <div class="sheet-title">Add a drill</div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="pk-q" type="search" autocomplete="off" placeholder="Search drills…" value="${esc(state.picker.q)}" />
      </div>
      <div class="chips">
        <button class="chip ${state.picker.cat === "all" ? "is-on" : ""}" data-pkcat="all">All</button>
        ${Object.keys(CATS).map(c => `<button class="chip ${state.picker.cat === c ? "is-on" : ""}" data-pkcat="${c}">${CATS[c]}</button>`).join("")}
      </div>
    </div>
    <div class="sheet-body" id="pk-list">${pickerListHtml()}</div>

function openPicker() {
  state.picker = { open:true, q:"", cat:"all" };
  renderPicker();
  document.body.classList.add("is-locked");
  const q = $("#pk-q"); if (q && matchMedia("(min-width:900px)").matches) q.focus();
}
function closePicker() {
  state.picker.open = false;
  renderPicker();
  document.body.classList.remove("is-locked");
  render();
}

function saveBuilder() {
  const d = state.builder;
  if (!d.blocks.length) return;
  const plan = { id: d.id || newId(), custom:true,
    title: (d.title || "").trim() || "My practice",
    date: d.date || null, goal: (d.goal || "").trim(),
    blocks: d.blocks.map(b => ({ drill:b.drill, min:Math.max(1, Number(b.min) || 1), note:(b.note || "").trim() })),
    updated: new Date().toISOString().slice(0, 10) };
  if (typeof plan.id === "number") {              // a season plan, edited in place
    EDITS[plan.id] = { title:plan.title, date:plan.date, goal:plan.goal, blocks:plan.blocks, updated:plan.updated };
    savePlanState();
  } else {
    const i = CUSTOM.findIndex(p => p.id === plan.id);
    if (i >= 0) CUSTOM[i] = plan; else CUSTOM.unshift(plan);
    saveCustom();
  }
  state.builder = null; lsSet(DRAFT_KEY, null);
  state.practice = plan.id;
  render(); window.scrollTo(0, 0);
}

function discardBuilder() {
  if (state.builder.blocks.length && !confirm("Throw away this practice?")) return;
  state.builder = null; lsSet(DRAFT_KEY, null);
  render(); window.scrollTo(0, 0);
}

function sharePlan(p, btn) {
  const url = shareUrl(p);
  const done = () => { if (btn) { btn.textContent = "Link copied"; setTimeout(() => { btn.textContent = "Share link"; }, 2000); } };
  if (navigator.share) { navigator.share({ title: `${TEAM.name} practice: ${p.title}`, url }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link:", url));
  else prompt("Copy this link:", url);
}

/* ── Send a plan back to the site admin ───────────────────────
   No server, so a submission is a block of text the coach shares, copies
   or emails. It carries a readable summary, the share link, and the exact
   entry for PRACTICES so the admin can paste it straight into index.html
   (or hand it to Claude with "add this as a season plan"). */
const ADMIN = { name:"Joe", email:"" };   // set email to enable the Email button

const jsStr = (s) => JSON.stringify(String(s == null ? "" : s));

function submissionText(p) {
  const total = practiceMinutes(p);
  const lines = p.blocks.map((b, i) => {
    const d = DRILLS[b.drill];
    return `${i + 1}. ${b.min} min · ${d.name} [${b.drill}]${b.note ? ` · Coach: ${b.note}` : ""}`;
  });
  const code = `{ id:NEXT, title:${jsStr(p.title)}, date:${p.date ? jsStr(p.date) : "null"},
  goal:${jsStr(p.goal || "")},
  blocks:[
${p.blocks.map(b => `    { min:${b.min}, drill:${jsStr(b.drill)}${b.note ? `, note:${jsStr(b.note)}` : ""} },`).join("\n")}
  ] },`;
  return `${TEAM.name} practice submission
Title: ${p.title}
Date: ${p.date || "TBD"}
Total: ${total} minutes
Goal: ${p.goal || "(none)"}

Blocks:
${lines.join("\n")}

Open it: ${shareUrl(p)}

--- Paste-ready entry for PRACTICES in index.html (replace NEXT with the next id) ---
${code}`;
}

function openSubmitSheet(p) {
  state.submit = p;
  const text = submissionText(p);
  const mail = ADMIN.email
    ? `mailto:${encodeURIComponent(ADMIN.email)}?subject=${encodeURIComponent(`Practice plan for the season: ${p.title}`)}&body=${encodeURIComponent(text)}`

}
function copySubmission() {
  const text = submissionText(state.submit);
  const ok = () => { const el = $("#sub-ok"); if (el) { el.textContent = "Copied — paste it into a text or email."; setTimeout(() => { el.textContent = ""; }, 2500); } };
  const manual = () => { const el = $("#sub-ok"); $("#sub-text").select();

}

/* ── Practice plans ───────────────────────────────────────── */
const practiceById = (id) => allPlans().find(p => p.id === id)
  || (state.shared && state.shared.id === id ? state.shared : null);
const parseId = (v) => /^\d+$/.test(v) ? Number(v) : v;
const practiceMinutes = (p) => p.blocks.reduce((n, b) => n + b.min, 0);
// The facets a practice covers, in the order they first appear (warm-up and
// scrimmage are every week, so they're left off the summary chips).
const practiceCats = (p) => [...new Set(p.blocks.map(b => DRILLS[b.drill].cat))]
  .filter(c => c !== "warm" && c !== "scrim");
const catChip = (c) => `<span class="cat ${c}">${CATS[c]}</span>`;
const clock = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;

const playIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>`;
const outIcon  = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>`;

// Link to the drill's video: YouTube when the source page embeds one, else
// the source's own video page. Write-ups with no video get a "Read" button.
function drillLink(d) {
  const href = d.video || d.url;
  const isVideo = !!d.video || d.src === "usab" || d.src === "jrnba";
  return `<a class="vid${isVideo ? "" : " read"}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
    ${isVideo ? playIcon : ""}${isVideo ? "Watch the drill" : "Read the drill"} ${outIcon}
  </a>`;
}

      <span class="mrow-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="mrow-txt"><b>Build a practice</b><span>Pick drills from the library, set the minutes, share it with the staff</span></span>
      ${chev}
    </button>
    ${draft && draft.blocks && draft.blocks.length ? `
    <button class="mrow" data-bresume>
      <span class="prow-n custom">Draft</span>

      ${chev}

    <div class="plan-tools">
      <div class="chips">${chip("all", "All")}${chip("mine", "Mine")}${chip("season", "Season plans")}</div>
      <button class="btn ghost small${reorder ? " is-on" : ""}" data-reorder>${reorder ? "Done" : "Reorder"}</button>
    </div>
    ${plans.length ? plans.map(row).join("")
      : `<p class="empty">${state.planFilter === "mine" ? "No practices of your own yet — build one above." : "No season plans shown."}</p>`}
    ${HIDDEN.length ? `<div class="restore">${HIDDEN.length} season plan${HIDDEN.length === 1 ? "" : "s"} deleted · <button data-restore>Restore</button></div>` : ""}

function practiceDetailView(id) {
  const p = practiceById(id);
  if (!p) return `<p class="empty">Unknown practice.</p>`;
  let at = 0;
  const rows = p.blocks.map(b => {
    const d = DRILLS[b.drill];
    const row = `<div class="blk">
      <div class="blk-when"><span class="blk-at">${clock(at)}</span><span class="blk-min">${b.min} min</span></div>
      <div class="blk-body">
        <div class="blk-top">${catChip(d.cat)}<span class="blk-name">${esc(d.name)}</span></div>
        <p class="blk-desc">${esc(d.desc)}</p>
        ${b.note ? `<p class="blk-note"><b>Coach:</b> ${esc(b.note)}</p>` : ""}
        ${drillLink(d)}
        <div class="blk-src">${SOURCES[d.src]}</div>
      </div>
    </div>`;
    at += b.min;
    return row;
  }).join("");

  return `
    <div class="plan-head">
      <div class="plan-meta">${p.shared ? "Shared practice" : p.custom ? "My practice" : "Season plan"}${p.edited ? " · edited" : ""} · ${practiceMinutes(p)} minutes · ${p.date ? fmtDate(p.date, { weekday:"long", month:"long", day:"numeric" }) : "Date TBD"}</div>
      <div class="plan-title">${esc(p.title)}</div>
      <p class="plan-goal">${esc(p.goal)}</p>
      <div class="plan-tags">${practiceCats(p).map(catChip).join("")}</div>
    </div>
    <div class="plan">${rows}</div>
    <p class="plan-foot">Times are a guide: if a drill is clicking, let it run and trim the next one. Water break between any two blocks.</p>
    <div class="plan-actions">
      ${p.shared ? `<button class="btn" data-adopt>Save to my practices</button>
                    <button class="btn ghost" data-dup="${p.id}">Customize a copy</button>` : `
        <button class="btn" data-edit="${p.id}">Edit</button>
        <button class="btn ghost" data-dup="${p.id}">Duplicate</button>
        <button class="btn ghost" data-share="${p.id}">Share link</button>
        ${p.custom || p.edited ? `<button class="btn ghost" data-submit="${p.id}">Send to the season plans</button>` : ""}
        ${p.edited ? `<button class="btn ghost" data-reset="${p.id}">Reset to original</button>` : ""}
        <button class="btn danger" data-delete="${p.id}">Delete</button>`}
    </div>`;
}

function drillLibraryView() {
  const groups = Object.keys(CATS).map(c => {
    const list = Object.values(DRILLS).filter(d => d.cat === c)
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) return "";
    return `<section class="lib-grp">
      <h3>${CATS[c]} <span>${list.length}</span></h3>
      <div class="lib-list">${list.map(d => `<div class="drill">
        <div class="drill-name">${esc(d.name)}</div>
        <p class="drill-desc">${esc(d.desc)}</p>
        ${drillLink(d)}
        <div class="blk-src">${SOURCES[d.src]}</div>
      </div>`).join("")}</div>
    </section>`;
  }).join("");
  return `<div class="lib">${groups}</div>`;
}

function practiceView() {
  if (state.builder) return builderView();
  if (state.practice) return practiceDetailView(state.practice);
  const tab = state.practiceTab;
  return `
    <div class="bstabs" role="tablist">
      <button class="bstab ${tab === "plans" ? "is-on" : ""}" data-practicetab="plans"
              role="tab" aria-selected="${tab === "plans"}">Practice Plans</button>
      <button class="bstab ${tab === "drills" ? "is-on" : ""}" data-practicetab="drills"
              role="tab" aria-selected="${tab === "drills"}">Drill Library</button>
    </div>
    ${tab === "drills" ? drillLibraryView() : practiceListView()}`;
}

/* ── Basketball Philosophy ────────────────────────────────────
   The coach's write-up, kept as markdown so it stays easy to edit. A tiny
   renderer handles headings, paragraphs, lists, bold and italic. The line
   "*[Graphs go here]*" is where the shot charts are dropped in. */
const PHILOSOPHY_MD = String.raw`
# Our Team Philosophy

## Where We're Starting From

We get to live and play in Northwest Arkansas, one of the best places in the world to raise a family. That said, when we travel to bigger markets, we'll often be playing teams from much larger talent pools. Their players will sometimes be bigger, stronger, and faster than ours. They'll rebound a little easier, get to the rim a little easier, and create turnovers with pure athleticism.

That's okay. We're not going to fly in players for tournaments to fix that. Our commitment is to develop our local boys and build a team on skill and team concepts that can compete regionally and nationally.

So how do we do that? We have to be better than the other team at *something*, or the better athlete simply wins. Here's our plan.

## 1. Be the Best Shooters in the Gym

This is what we will be known for. Shooting is the #1 skill in today's game, and it's the one that adds the most value to your son as a player. We'll work on it every practice, but the truth is, becoming a great shooter is a 12-month commitment that happens mostly on your son's own time. The player is responsible for the player, not the coach, not the parent. If he puts in the work, he'll see it pay off.

## 2. Be the Best Defensive Team in the Gym

We play **Pack Line defense**. In simple terms, we take away the paint, which is exactly where the better athlete wants to go. That creates frustration and impatience for their offense. We force contested outside shots, their percentages drop, and our defensive rebounds go up.

A few things this means for how we play:

- **We don't gamble.** We don't go for steals; we stay at home and force shots over us. Our transition chances come from rebounds, not steals.
- **All five guys move as one** while the ball is in the air. That takes basketball IQ and a lot of reps, so we'll drill it constantly.
- **We need a great post defender**, because we won't double the post. We'd rather give up a one-on-one post move than an open 3 or a drive to the rim.
- **Ball screens.** We'll teach several ways to guard them (Hedge, Switch, Go Under, Plug, Drop, Blitz), with Hedge as our standard, and adjust based on who we're playing.
- **Close outs.** A player makes around 300 close outs in a game. We'll rep these every practice and teach the boys to close out differently on a driver vs. a shooter.

## 3. We Play a Transition Game

We want to score 50%+ of our points in transition, so we practice it a lot. Our "Race & Space" isn't old-school run and gun; it's a real offensive set with built-in actions designed to attack the defense before it's set. Open shots against a scrambling defense go in at a much higher rate than shots against a set defense.

The flip side: we do everything we can to keep the other team from scoring in transition. That means no live turnovers, and it means we send 1 to 4 guys back on our own shot. We'll give up a few offensive rebounds, but we'll force them to play against our half-court defense, which is going to be really good.

## 4. Don't Turn the Ball Over

We'll teach this in every drill through dribbling and passing fundamentals. Don't force passes. I'll live with a few bad shots over a live turnover any day. We want our boys making the right read and the easy pass, letting the defense be wrong. This keeps athletic teams out of the open floor and makes them play half-court basketball, which they don't want to do.

## 5. Don't Foul

Free throws are the best shot in basketball, so they're the last thing we want to give away. Fouling also slows the game down, and we want to play fast. And it lets the other team catch their breath. We plan on being the better-conditioned team, so let's keep them moving.

## 6. Be a Great Defensive Rebounding Team

Pack Line naturally puts us in good rebounding position. Those rebounds feed our Race & Space transition, which feeds our best shots. It all connects.

## 7. Share the Ball

We won't win games playing one-on-one; that's a game we lose. We create shots for each other and don't care who scores, only that the team scores. Three out of every four baskets should come off an assist. And we only take shots we've practiced.

## Culture

Nobody on this team is more important than anyone else. We all just have different roles, and I'll help define those for each player. We're big on engagement, encouragement, and picking each other up, which is why we start every practice side by side.

**Be an All-Star in your role!**

## Why We Don't Play Zone

There's a great article by Tyler Coston (PGC) called "Why Zone Defense is Bad for Youth Basketball" that says it better than I can. The short version: we are a development team. No local Big 4 high school, college, or NBA team plays zone as its base defense. Zone wins games at a young age because kids can't shoot outside yet, but it doesn't teach the skills your son will need later. We'll teach man-to-man with real rotations, we'll miss some of them early, and your son will be better for it down the road.

## Why We Don't Press

Honest confession: I love to press. I love the conditioning, the extra minutes for more players, and the pressure it puts on an offense. But after learning from the University of Arkansas women's staff, I'm convinced it's the wrong use of our time at this level.

Pressing takes a lot of practice time to do well, and practice time is the most precious thing a youth coach has. Almost no high school, college, or NBA team presses as its base defense because offensive skill is simply too high now. So we'll spend our hours on offensive, defensive, and transition skills that actually transfer.

Yes, pressing teams often win at the youth level. They live off steals and layups against offenses that aren't developed yet. But they're not building their half-court game, and we will be. We may lose some games early because of it, but our boys will be ahead later. I'll do what's best for your son, not what I'd personally enjoy most.

## Shot Philosophy

Shooting is a math problem: which shots give us the most points per possession? Here's our shot selection, in order:

1. **Free throws.** A 70% shooter gets 1.4 points per trip.
2. **Drive and finish at the rim through contact.** A 65% finisher gets 1.3 points per possession.
3. **Uncontested 3's.** A 40% shooter gets 1.2 points per possession.
4. **Contested / dribble-up 3's.** A 35% shooter gets 1.05. This takes high-end skill and will only be a green light for a few coach-selected players. It keeps the defense stretched so we can get to options 1 and 2.

**The shot we don't take: long, contested 2's.** Even at 40%, that's only 0.8 points per possession, and it shrinks our spacing.

So our offense is built to attack the rim and the low post first, earning free throws or high-percentage finishes. Then we look for uncontested 3's, which stretch the defense and open up more driving lanes. We want to play *downhill*, especially in transition before the defense is set.

*[Graphs go here]*

The numbers back it up. For the best shooters in the world, shooting percentage is nearly flat from 3 feet out to 27 feet. Once you factor in that shots beyond the arc are worth 3 points, a shot from 21 feet (40% × 3 = 1.2 points) is worth a lot more than a shot from 3 feet (40% × 2 = 0.8). Add in free throws at 75% (1.5 points per two shots), and you can see why we attack the rim and shoot 3's.

If your son genuinely wants to play at the next level, he needs to be excellent at finishing at the rim and shooting the 3. That's why so much of our training time goes to attacking the basket and every kind of 3-point shot: kick-outs, off the bounce, pass-ahead, sprinting off screens, drifts, and more.
`;

// Markdown → HTML for the subset the write-up uses. Bold/italic use the
// escaped text, so nothing in the markdown can inject markup.
function mdToHtml(md) {
  const inline = (s) => esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
  const out = [];
  const stack = [];                        // open lists: { tag, level, li }
  const closeTo = (level) => { while (stack.length && stack[stack.length - 1].level >= level) {
    const l = stack.pop(); out.push((l.li ? "</li>" : "") + `</${l.tag}>`); } };
  md.split("\n").forEach(raw => {
    const line = raw.trim();
    if (!line) return;                                                   // blank lines don't end lists
    const m = raw.match(/^(\s*)(-|\d+\.) (.*)$/);
    if (m) {
      const level = Math.floor(m[1].length / 2), tag = m[2] === "-" ? "ul" : "ol";
      closeTo(level + 1);                                                // drop deeper lists
      const top = stack[stack.length - 1];
      if (top && top.level === level && top.tag === tag) { out.push("</li>"); }
      else { if (top && top.level === level) closeTo(level); out.push(`<${tag}>`); stack.push({ tag, level, li:false }); }
      out.push(`<li>${inline(m[3])}`); stack[stack.length - 1].li = true;
      return;
    }
    closeTo(0);
    if (line.startsWith("# ")) return;                                   // page title lives in the header
    if (line.startsWith("## ")) { out.push(`<h2>${inline(line.slice(3))}</h2>`); return; }
    if (line.startsWith("### ")) { out.push(`<h3>${inline(line.slice(4))}</h3>`); return; }
    if (line === "*[Graphs go here]*") { out.push("<!--charts-->"); return; }
    if (/^<!--\w+-->$/.test(line)) { out.push(line); return; }
    if (/^\*\*[^*]+\*\*$/.test(line)) { out.push(`<p class="callout">${inline(line)}</p>`); return; }
    out.push(`<p>${inline(line)}</p>`);
  });
  closeTo(0);
  return out.join("\n");
}

// One-series line chart with a hover tooltip. `ref` draws a labelled
// reference line; `band` shades the three-point range.
function lineChart(id, values, o) {
  const W = 640, H = 300, L = 44, R = 14, T = 18, B = 46;
  const n = values.length;
  const x = (i) => L + i * (W - L - R) / (n - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - o.min) / (o.max - o.min));
  const ticks = o.ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>
    <text class="tick y" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${o.fmt(t)}</text>`).join("");
  const path = values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const dots = values.map((v, i) => `<circle class="dot" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"/>`).join("");
  const labels = FEET.map((f, i) => (i % 3 === 0 || i === 30)
    ? `<text class="tick" x="${x(i).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${f}</text>` : "").join("");
  const band = o.band ? `<rect class="band" x="${x(o.band[0]) - 4}" y="${T}" width="${x(o.band[1]) - x(o.band[0]) + 8}" height="${H - T - B}" rx="6"/>
    <text class="band-l" x="${(x(o.band[0]) + x(o.band[1])) / 2}" y="${T + 13}" text-anchor="middle">3-point range</text>` : "";
  const ref = o.ref ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(o.ref)}" y2="${y(o.ref)}"/>
    <text class="ref-l" x="${x(4)}" y="${y(o.ref) - 7}" text-anchor="start">${o.refLabel}</text>` : "";
  return `<div class="chart" data-chart="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
      ${band}${ticks}
      <line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      ${ref}
      <line class="hair" data-hair x1="0" x2="0" y1="${T}" y2="${H - B}"/>
      <path class="line" d="${path}"/>
      ${dots}
      ${labels}
      <text class="axis-l" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Feet from the basket</text>
      <rect class="hit" data-hit x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/>
    </svg>
    <div class="tip" data-tip></div>
  </div>`;
}

// A hex-bin style half court. `spots` is a list of [x, y, weight] in court
// units (feet from the baseline centre); weight 2 = hot, 1 = warm, 0 = cool.
function halfCourt(label, spots) {
  const W = 300, H = 282, s = 6;         // 50ft wide court → 6px per foot
  const cx = W / 2, base = H - 8;         // baseline at the bottom, rim 5.25ft up
  const px = (fx) => cx + fx * s, py = (fy) => base - fy * s;
  const hex = (x, y, r) => { const pts = []; for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; pts.push(`${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`); } return pts.join(" "); };
  const arcR = 23.75 * s, cornerX = 22 * s, cornerY = 14 * s;
  const ay = Math.sqrt(arcR * arcR - cornerX * cornerX);
  const rimY = py(5.25);
  const threes = `M${cx - cornerX} ${base} V${rimY - ay + (rimY - py(5.25))} A${arcR} ${arcR} 0 0 1 ${cx + cornerX} ${rimY - ay + (rimY - py(5.25))} V${base}`;
  const hexes = spots.map(([fx, fy, w]) => `<polygon class="hex${w === 2 ? " hot" : w === 1 ? " warm" : ""}" points="${hex(px(fx), py(fy), 5.4)}"/>`).join("");
  return `<div class="court">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} shot locations">
      <rect class="floor" x="0" y="0" width="${W}" height="${H}" rx="10"/>
      <g class="lines">
        <rect x="${cx - 8 * s}" y="${py(19)}" width="${16 * s}" height="${19 * s}"/>
        <circle cx="${cx}" cy="${py(19)}" r="${6 * s}"/>
        <path d="${threes}"/>
        <line x1="${cx - 3 * s}" x2="${cx + 3 * s}" y1="${py(4)}" y2="${py(4)}"/>
        <circle cx="${cx}" cy="${rimY}" r="${0.75 * s}"/>
      </g>
      ${hexes}
    </svg>
    <div class="court-l">${esc(label)}</div>
  </div>`;
}

// Stylised after Kirk Goldsberry's "top 200 shot locations" comparison:
// 2001-02 lived in the paint and the mid-range; 2019-20 is the rim and the
// three-point line, with the mid-range nearly empty.
function courtSpots(era) {
  const out = [];
  // Seeded so the map is identical on every render (mulberry32).
  let seed = era === "old" ? 2002 : 2020;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ring = (r, n, w, jitter, from, to) => { for (let k = 0; k < n; k++) { const a = from + (to - from) * (k / (n - 1)); out.push([r * Math.cos(a) + (jitter ? (rnd() - .5) * jitter : 0), 5.25 + r * Math.sin(a), w]); } };
  const blob = (n, spread, w, cy) => { for (let k = 0; k < n; k++) { const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * spread; out.push([r * Math.cos(a), cy + r * Math.sin(a) * .8, w]); } };
  blob(46, 4.2, 2, 5.5);                                  // at the rim
  if (era === "old") {
    blob(24, 7.5, 1, 7);                                  // paint
    ring(12, 9, 1, .6, .25, Math.PI - .25); ring(15.5, 10, 0, .6, .2, Math.PI - .2);   // mid-range
    ring(18.5, 9, 1, .6, .3, Math.PI - .3);
    ring(23.5, 7, 0, .5, .55, Math.PI - .55);             // a few threes
    for (let k = 0; k < 4; k++) { out.push([-22, 2 + k * 2.2, 0]); out.push([22, 2 + k * 2.2, 0]); }
  } else {
    ring(24.2, 22, 2, .4, .5, Math.PI - .5); ring(25.6, 20, 1, .5, .48, Math.PI - .48);   // the arc
    ring(27, 16, 0, .5, .55, Math.PI - .55);
    for (let k = 0; k < 6; k++) { out.push([-22.3, 1.5 + k * 2.1, 2]); out.push([22.3, 1.5 + k * 2.1, 2]); }   // corners
    for (let k = 0; k < 5; k++) { out.push([-23.6, 2 + k * 2.1, 1]); out.push([23.6, 2 + k * 2.1, 1]); }
    blob(8, 3, 0, 11);                                    // a little floater range
  }
  return out;
}

const CHART_DATA = { pct: { v:SHOT_PCT, fmt:(v) => v + "% made" }, pps: { v:SHOT_PPS, fmt:(v) => v.toFixed(2) + " points per shot" } };
function chartHover(e) {
  const chart = e.target.closest(".chart"); if (!chart) return;
  const svg = chart.querySelector("svg"), hit = chart.querySelector("[data-hit]");
  const d = CHART_DATA[chart.dataset.chart]; if (!d) return;
  const r = hit.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width));
  const i = Math.round(t * (d.v.length - 1));
  const dot = chart.querySelector(`.dot[data-i="${i}"]`);
  chart.querySelectorAll(".dot").forEach(c => c.setAttribute("r", c === dot ? 6.5 : 4));
  const hair = chart.querySelector("[data-hair]");
  hair.setAttribute("x1", dot.getAttribute("cx")); hair.setAttribute("x2", dot.getAttribute("cx")); hair.style.opacity = 1;
  const tip = chart.querySelector("[data-tip]");
  tip.innerHTML = `<b>${FEET[i]} ft</b> · ${d.fmt(d.v[i])}`;
  tip.classList.add("is-on");
  const frac = i / (d.v.length - 1);
  tip.style.left = frac > .6 ? "8px" : "auto"; tip.style.right = frac > .6 ? "auto" : "8px";
}
function chartLeave(e) {
  const chart = e.target.closest(".chart"); if (!chart) return;
  chart.querySelectorAll(".dot").forEach(c => c.setAttribute("r", 4));
  const hair = chart.querySelector("[data-hair]"); if (hair) hair.style.opacity = 0;
  const tip = chart.querySelector("[data-tip]"); if (tip) tip.classList.remove("is-on");
}

   Defensive Levels, Transition Defense and Read & React, transcribed
   from the coaching sheet. Same markdown mini-format as the philosophy:
   ##, ###, bullets (indent two spaces to nest), 1. lists, **bold**,

const DEF_LEVELS_MD = String.raw`
## The Four Levels of a Defender

From Dick Helm, fifteen years an NBA and college coach, by way of Betterbasketball.com. A defender grows through these levels in order, and the team is only as good as its weakest level.

- **Level 0 · Rebounding.** Every possession ends with the ball in our hands.
- **Level 1 · Guard the ball** *(individual)*. Keep the ball out of the middle third of the floor. Be able to stay in front of the ball.
- **Level 2 · Guard away from the ball** *(individual)*. Be in position to help a teammate stop the ball from being shot, driven or passed into the middle third. Block cutters and deny passes into the highway.
- **Level 3 · Guard situations** *(team)*. Be able to switch, hedge and rotate when you're required to.
- **Level 4 · Help everyone recover** *(team)*. Help everyone rotate back to their original responsibilities without giving up a basket.

A word we use everywhere: the **Highway** is the middle third of the floor. The **Alley** is the sideline third on either side. We want the ball in the alley.

## Level 0 · Rebounding

### The keys

- **War Zone** = the ten-foot square around the basket. **Outside** = anything not in the War Zone.
- In the War Zone: **B.O.W.Z.** = Block Out in the War Zone. Your power base on the opponent's power base.
  - Step through, or reverse pivot. You must know both.
  - Block out and PURSUE the ball. **DNA** = Dadgum Nasty Attitude: assume the rebound is a pass to you.
- Outside: **C.A.P.** = Check, Arc, Pursue.
  - Check position is your shoulders at a 90-degree angle to your opponent. Use the forearm.
  - If your opponent pursues the ball, use your forearm to arc them away from the basket.
  - If your opponent is stronger and gets into the War Zone, use the arm bar to get into power position.
  - If your opponent does not pursue the ball, sprint to the elbow and get ready to chase the long rebound.
- Once you secure the rebound, **rebound like a quarterback**: three points of contact on the ball. When your feet hit the floor, snap your eyes to our goal and read: 1) is a press forming? 2) is there a quick outlet? 3) is there space to dribble?

### Drills

- **Shooter and offside low post.** A three-point shot goes up. The defender guarding the shooter CAPs him. The defender on the low post practices the hardest move in basketball: step away from the goal and BOWZ the offensive man. The drill ends when the defense **R.O.A.R.s** = Rebound, Outlet And Run.
- **Line under the basket to the low post.** One on offense, one on defense, go twice on D, two coaches on the wings. The coach looks to enter the ball to the low post. If he passes, go from Level 2 to Level 1 and keep the ball out of the highway. If the coach skip passes, jump to the ball, coach shoots, block off, outlet to the coach.

## Level 1 · Guard the Ball

Keep the ball out of the middle third of the floor.

1. On dead balls: eat up space.
2. Keep the ball outside the arc and out of the highway.
3. Cut off the baseline on baseline drives.
4. Hands are up. Hands down = **E.S.P.** = External Signs of Passivity.
5. Interrupt the rhythm of the shot.
  - Make them hang in the air longer than they want.
  - Make them move the ball out of their shot pocket and adjust the shot.
  - Anything to take them out of the rhythm of their shot.
6. If they catch the ball in the highway, force a **U drive** to help, not a V drive.
  - The minute the ball is dribbled once, go forearm to elbow, showing hands to the official, and force the dribble to the sideline out of the highway.
  - Same for dribblers coming into the highway: don't force a direction change, keep the ball moving through the highway to the other side and out.
  - If the ball must be dribbled into the highway, arc it as far from the goal as you can, help it across the highway as fast as possible, then keep it in the alley once it's there.
7. Must be able to take a charge effectively.

If the offense picks up the dribble, become a **close talker**. Three positions we call: Twilight, Midnight, and Substitution Position.

### Stance

- Hips lower than the man you are defending.
- Be in a position to move laterally very quickly: one foot planted, the other moves six to eight inches.
- A Level 1 defender has to be able to get up on his man. Today's ball handlers will shake and bake you if they have space. Close talker.
- Force everything sideline or baseline, never highway.
- Hand out in the direction of the drive, off hand down to take away the crossover.
- On the wing or point: in his face, shoulders to the highway. When they drive baseline, take one step-slide with the off arm, then turn and run with them.

### Taking the charge on the ball

1. **The four-inch fall.** The closer the offense gets, the lower you get to the floor. No statues: low and athletic.
2. **Firm forearm** at 45 degrees, not up at 90. Firm. They will push you back. Sell the call.
3. Fall on both cheeks on the line of the attack. Crumbling to one side tells the ref you weren't square, and that's a blocking call.
4. Fall in the direction of the penetration.
5. Roll and get your feet high, pointing to the sky.
6. Hands up, no bracing the fall. It's only four inches. Get the off hand up to protect yourself.
7. Like martial arts: exhale and make a sound on contact. Sell the call.

### Why we force the ball baseline

Don't let the ball drive into the highway; force it to the baseline and corners. Why?

1. The offense is shrinking the amount of usable court they have to work with.
2. The baseline becomes a defensive sixth man.
3. Shooting angles are worse than from the middle of the floor.
4. Natural passing angles are fewer and harder.
5. Off-ball defenders drop to the goal more easily than when the ball is driven into the middle.

Hips are the **doors to the highway**. If the ball handler forces you to open the door, do not keep step-sliding: sprint to close it. Step-slide to the sideline, on the pivot sprint to the highway, recover the bubble and close the door. You can't close your hips until your head is lower than the offensive player's shoulders, or they'll call the foul.

### Level 1 drills

- Four-inch fall: teaching technique, then group technique.
- Guard the ball: line under the basket, coach with the ball at the point. Offense breaks open, defense closes and defends. Don't let him into the highway.
  - Half-court alley one on one.
  - Full-court alley one on one.
- Recover the bubble: defense sprints ahead to recover correct position after being beaten.

### Grades of a Level 1 defender

- **Great.** Takes away all three options of the triple threat: the shot, the pass and the dribble into the highway. Close talker. Forces the ball into Twilight position so it's hard to pass into the highway. Gets under the elbows and encourages the offense to move the ball into Substitution Position (Statue of Liberty). Never opens the hips, never opens the gate, on the first or second dribble.
- **Good.** Takes away at least two of the three threats. Usually gives up daylight instead of Twilight.
- **OK.** Takes away at least one of the three threats. High talker, plays outside the bubble.

## Level 2 · Guard Away from the Ball

Be in a position to help a teammate stop the ball from being shot, driven or passed into the middle third of the floor.

**Goal:** guard two-thirds of the floor and keep the ball out of the highway while offensive situations are happening, and do it without switching.

- How close to the ball should you be on the weak side? It depends on the player: close enough that the ball can't get into the highway.
- **Help and recover** must be one word. You must be able to help and recover to your man without giving up a shot in the highway. A proper close out matters here.
  - Ball passed = move your feet during the air time of the pass. Don't wait to see it caught.
  - Stop the dribble and recover = usually a drop step and a sprint back to your man. Recover on an angle, not a straight line, knowing the drive path of the receiver.
- A Level 2 charge is taken with your help, not on the ball.
- **Skirmish**: give the impression you'll take the charge, then recover to your player. Make the dribbler unsure. Rapid movement with hands, feet and face. Either skirmish and recover, or skirmish and take the charge. Very effective from the low post.
- **Close out priorities**: 1) stop the catch and shoot, 2) block the highway drive, 3) cut off the baseline drive. The other four defenders close out to their Level 2 help positions on the air time of the pass.
- **Post defense**: deny or discourage the pass into the post.
  - Dead front: negative, you give up rebound position and can be sealed. Positive, no pass gets in and you can help more easily.
  - Three-quarter deny on the top side: what most use. If the pass goes in, you have the air time of the pass to recover to Level 1.
  - On a perimeter pass, get up the line and on the line, same rules as everyone. Not on the post's hips, he'll use you.

### Level 2 drills

1. **Close out, Level 2 charge.** Four offense, two defense. Offense drives middle or baseline, off-ball defender closes out and takes the charge. Stay in your stance.
2. **Transition 120** (Levels 1, 2 and 0). Offense drives the full-court alley, defense keeps it in the alley. At the offensive end: pass to the point, defense adjusts; pass to the corner, adjust; corner drives, stop it before the highway; offense skips out; defense closes out on the shooter, blocks off and gets the rebound.
3. **Help across, not up.** Point and wing with defenders. Point drives the defender's side, wing defender drops and helps and recovers, point pitches to the wing, defender closes out on the shot, blocks off, rebounds.
4. **2 on 2 help and recover.** Groups of four, one ball. Drive, help, recover.
5. **3 on 3 help and recover.** Same, teammates move one spot in the direction of the drive.
6. **Defend the post.** Wing, point and post with defenders. Move on the post entry to Level 1, kick out, defender moves up the line, deflect the second pass.
7. **Air time of the pass.** Stationary shell.
8. **Help behind the help.** Shell with dribble drives: jump from Level 1 to Level 2 on the pass.
9. **Jump from 1 to 2 on a cutter.**
10. **4-out position check.** Ball rotates around, check post defense, everyone rotates into the post to check position.
11. **Make 'em bounce off.** Ball drives once right then once left, offense moves one spot in that direction, defense helps and recovers.
12. **Post flash and cutters.** Weak-side post flashes to the ball: meet and greet. Then weak-side perimeter players flash: meet and greet.

## Level 3 · Guard Situations

Be able to switch and/or rotate when you're required to.

A **situation** is any breakdown in Level 1 that Level 2 can't handle. It requires switching or double-teaming to stop the ball from scoring.

- **Surprise situations**: the ball gets beaten cleanly and is driving the lane. Level 3 sees it, swaps bubbles, stops the ball.
- **Planned situations**: the coach defines them. Post feeds, ball screens, zone traps on baseline out-of-bounds.
  - Baseline drive: on a right-side baseline drive, the opposite-corner defender stops the drive and everyone rotates one player to the right.
  - Ball screens: 1) switch (swap bubbles), 2) show and recover, 3) press up and go under.
  - Post feeds: double on 1) the pass in the air, 2) the post catch, or 3) the post move. Coach decides where the double comes from.
  - Failed traps.
  - Communication: 1) no talk, 2) talk without much useful information, or 3) useful information. We want the third.

## Level 4 · Help Everyone Recover

Help everyone rotate back to their original responsibilities without giving up a basket.

1. Can you rotate out of a situation without giving up a basket or an entry into the highway?
2. When rotations leave you in a mismatch, a Level 4 player knows when and where to switch back to a better matchup.
3. A great Level 4 knows how everyone should be rotating and talks them through it until everyone is back where we want them.
`;

const DEF_TRANSITION_MD = String.raw`
## Transition Defense

From Andrej Lemanis, head coach of the Australian national team. Watch his clinic: [Drills for Transition Defense (FIBA)](https://www.youtube.com/watch?v=l5uZmj_qzXU).

1. In transition, **your man is not your man**. Guard the team.
2. **No buddy running.** Sprint to protect the basket.
3. Pick up the ball before the three-point line and force it out of the highway. Shrink the open space; the other players help.
4. **Last big down** goes low to the ball, usually the top of the key. No buddy running: he is free help while the other big trails.
5. Bigger players kick the smalls out of the paint so we match up with shooters.

## Drill progression

### 1 on 1 on 1

- Start one on one from half court. Force the ball out of the highway.
- An offensive teammate waits at half court, one team on each side.
- After the shot, the defender becomes offense and the offense becomes defense. Force it out of the highway again.
- When the ball crosses half court the new defender picks up and the old one comes off.
- Slow the basketball down. No pace makes it easier to defend. **Split the court.**
- The waiting defender talks: tell the player where to guide the ball so you can defend it.
- Five seconds to score.

### 2 on 2 on 2

- Start the same way.
- In transition keep the ball on one side of the court. Don't turn him.
- It's easier for a half-court defense to pick up on the sideline: fewer options.
- The off defender sprints back to make the floor narrow for the ball.
- Talk about what position and which ball you have.
- The off defender fakes and drops to buy time for the ball defender.
- The one thing you can't do is get beat. Stay in front of the ball.

### 2 on 2 on 2, new players at the free-throw line extended

- The outlet goes to a player who has to step inside the three-point line. The off player may sprint to the basket for the ball.
- So the defense now has to stop the ball AND sprint back to protect the basket. If one is contesting the shot, the other covers back.
- One team at each end in different jerseys.

### 4 on 4 on 4 (three jersey colors)

- Four on defense, four on offense, four at the other end: corner, point, corner, post.
- Someone shoots, the defense outlets to the coach who throws ahead. Defense sprints back.
- Defense must talk: who has the ball, who has the post.
- Guard the ball and the basket first. You can't just find your man.
- Normally the last one back guards the highest player on the weak side.

### 5 on 5

- The shooter must touch the baseline before getting back.
- Defense covers the basket, covers the ball, splits the court; the trailer sprints back to help.
- The offense decides how many go to the offensive boards and who; the rest get back.
`;

/* Read & React layers, from the coaching sheet. Each row: number, name and
   the first grade band that runs it (3 = 3rd, 4 = 4th, 5 = 5th/6th,
   7 = 7th/8th, 9 = 9th/10th). Our 4th graders run everything with from <= 4. */
const RR_GROUPS = [
  { name:"Foundation", layers:[
    [1, "Pass & Cut", 3], [2, "Post Pass & Cut, north-south (Laker cut)", 3], [3, "Dribble At", 3],
    [4, "Circle movement: dribble penetration, north-south", 4], [5, "Basic post slides: dribble penetration", 4],
    [6, "Baseline dribble penetration", 5], [7, "Pin & Skip", 4], [8, "Circle reverse", 5] ] },
  { name:"Enhanced", layers:[
    [9, "Post screens", 5], [10, "Back screens", 5], [11, "Multiple screens", 7], [12, "Ball screens", 5],
    [13, "Post pass & X cut, east-west", 4], [14, "Corners (pass & cut)", 7], [15, "Power dribble", 5], [16, "Advanced post slides", 7] ] },
  { name:"Supplemental", layers:[
    [17, "Transition offense", 5], [18, "Press break", 4], [19, "Full court trips", 7], [20, "Flow", 7] ] },
];
const RR_GRADES = [[3, "3rd"], [4, "4th"], [5, "5th–6th"], [7, "7th–8th"], [9, "9th–10th"]];
const RR_BEST_AT = ["Passion", "Defense", "Passing", "Rebounding", "Offense", "Transition"];   // grade bands add one each
const OUR_GRADE = 4;

function rrLayersTable() {
  const head = RR_GRADES.map(([g, l]) => `<th class="${g === OUR_GRADE ? "is-us" : ""}">${l}</th>`).join("");
  const rows = RR_GROUPS.map(gr => `<tr class="grp"><td colspan="${2 + RR_GRADES.length}">${gr.name}</td></tr>` +
    gr.layers.map(([n, name, from]) => `<tr class="${from <= OUR_GRADE ? "is-ours" : ""}">
      <td class="n">${n}</td><td class="name">${esc(name)}</td>
      ${RR_GRADES.map(([g]) => `<td class="${g === OUR_GRADE ? "is-us" : ""}">${g >= from ? "✓" : ""}</td>`).join("")}
    </tr>`).join("")).join("");
  const counts = RR_GRADES.map(([g]) => RR_GROUPS.flatMap(x => x.layers).filter(l => l[2] <= g).length);
  const best = RR_GRADES.map(([g], i) => `<td class="${g === OUR_GRADE ? "is-us" : ""}">${RR_BEST_AT.slice(0, i + 2).join("<br>")}</td>`).join("");
  return `<div class="rr-scroll"><table class="rr">
    <thead><tr><th></th><th class="name">Layer</th>${head}</tr></thead>
    <tbody>
      <tr class="grp"><td colspan="2">We will be the best team we play at:</td>${best}</tr>
      ${rows}
      <tr class="tot"><td colspan="2">Layers by age group</td>${counts.map((c, i) => `<td class="${RR_GRADES[i][0] === OUR_GRADE ? "is-us" : ""}">${c}</td>`).join("")}</tr>
    </tbody>
  </table></div>
  <p class="fig-cap">The highlighted column is us. A 4th-grade team runs eight layers: 1 through 5, Pin &amp; Skip, the X cut and the press break.</p>`;
}

  { label:"Scoring", tiles:(s) => [
      ["Points", s.pts], ["PPG", s.pts != null ? per(s.pts, s.gp) : null],
      ["FG", (s.fgm != null || s.fga != null) ? ma(s.fgm, s.fga) : null],
      ["FG %", s.fga ? pct(s.fgm, s.fga) : null],
      ["3PT", (s.tpm != null || s.tpa != null) ? ma(s.tpm, s.tpa) : null],
      ["FT", (s.ftm != null || s.fta != null) ? ma(s.ftm, s.fta) : null] ] },
  { label:"Rebounding", tiles:(s) => [
      ["Rebounds", s.reb], ["RPG", s.reb != null ? per(s.reb, s.gp) : null],
      ["Offensive", s.oreb], ["Defensive", s.dreb] ] },
  { label:"Playmaking & Defense", tiles:(s) => [
      ["Assists", s.ast], ["Steals", s.stl], ["Blocks", s.blk], ["Turnovers", s.to] ] },
  { label:"Fouls", tiles:(s) => [

function statsSection(st, name) {

    .map(g => {

        .join("");
      return tiles ? `<div class="statgrp">
        <div class="statgrp-h">${g.label}</div>
        <div class="statrow">${tiles}</div>
      </div>` : "";
    }).join("");

  return `<section class="stats">
    <div class="stats-h">
      <h3>Season Stats</h3>
      <span>${TEAM.season} · ${st.gp} of ${PLAYED.length} game${PLAYED.length === 1 ? "" : "s"} played</span>
    </div>
    ${groups || `<p class="stats-empty">No stats recorded for ${esc(name)} yet this season.</p>`}
  </section>`;
}
