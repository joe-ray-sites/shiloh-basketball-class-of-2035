  // Schedule → box score, and back again.
  const box = e.target.closest("[data-box]");
  if (box) { state.box = Number(box.dataset.box); state.boxTab = "stats"; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back]")) { state.box = null; render(); window.scrollTo(0, 0); return; }

  const sea = e.target.closest("[data-season]");
  if (sea) { state.season = Number(sea.dataset.season); state.seasonTab = "schedule"; state.leaders = null; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back-season]")) { state.season = null; state.leaders = null; render(); window.scrollTo(0, 0); return; }

  const pr = e.target.closest("[data-practice]");
  if (pr) { state.practice = parseId(pr.dataset.practice); render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back-practice]")) { state.practice = null; state.builder = null; render(); window.scrollTo(0, 0); return; }

  // Practice builder
  if (e.target.closest("[data-bnew]")) return openBuilder(null);
  if (e.target.closest("[data-bresume]")) { const d = lsGet(DRAFT_KEY, null); if (d) { state.builder = d; state.practice = null; render(); window.scrollTo(0, 0); } return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const p = practiceById(parseId(ed.dataset.edit)); if (p) openBuilder(p); return; }
  const dup = e.target.closest("[data-dup]");
  if (dup) { const p = practiceById(parseId(dup.dataset.dup)); if (p) openBuilder(p, true); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const p = practiceById(parseId(sh.dataset.share)); if (p) sharePlan(p, sh); return; }
  const sb = e.target.closest("[data-submit]");
  if (sb) { const p = practiceById(parseId(sb.dataset.submit)); if (p) openSubmitSheet(p); return; }
  if (state.submit) {
    if (e.target.closest("[data-subdone]") || e.target.id === "sheet") return closeSubmitSheet();
    if (e.target.closest("[data-subcopy]")) return copySubmission();
    if (e.target.closest("[data-subshare]")) {
      navigator.share({ title:`Practice plan: ${state.submit.title}`, text:submissionText(state.submit) }).catch(() => {});
      return;
    }
  }
  const rs = e.target.closest("[data-reset]");
  if (rs) { delete EDITS[parseId(rs.dataset.reset)]; savePlanState(); render(); return; }
  const del = e.target.closest("[data-delete]");
  if (del) {
    const p = practiceById(parseId(del.dataset.delete));
    if (!p) return;
    const msg = p.custom ? `Delete “${p.title}”? This can't be undone.`
                         : `Remove “${p.title}” from the season plans? You can restore it from the list.`;
    if (confirm(msg)) {
      if (p.custom) { CUSTOM = CUSTOM.filter(x => x.id !== p.id); saveCustom(); }
      else { HIDDEN.push(p.id); savePlanState(); }
      state.practice = null; render(); window.scrollTo(0, 0);
    }
    return;
  }
  if (e.target.closest("[data-restore]")) { HIDDEN = []; savePlanState(); render(); return; }
  if (e.target.closest("[data-reorder]")) { state.reorder = !state.reorder; render(); return; }
  const pf = e.target.closest("[data-pfilter]");
  if (pf) { state.planFilter = pf.dataset.pfilter; render(); return; }
  const pm = e.target.closest("[data-pmove]");
  if (pm) { const [id, dir] = pm.dataset.pmove.split(":"); movePlan(parseId(id), Number(dir)); render(); return; }
  if (e.target.closest("[data-adopt]") && state.shared) {
    const p = Object.assign({}, state.shared, { id:newId(), shared:false, updated:new Date().toISOString().slice(0, 10) });
    CUSTOM.unshift(p); saveCustom();
    history.replaceState(null, "", location.pathname + "#practice");
    state.shared = null; state.practice = p.id; render(); window.scrollTo(0, 0);
    return;
  }
  if (state.builder) {
    const bm = e.target.closest("[data-bmin]");
    if (bm) { const [i, dlt] = bm.dataset.bmin.split(":").map(Number); const b = state.builder.blocks[i];
      if (b) { b.min = Math.max(1, Math.min(120, (Number(b.min) || 0) + dlt)); saveDraft(); render(); } return; }
    const mv = e.target.closest("[data-bmove]");
    if (mv) { const [i, dlt] = mv.dataset.bmove.split(":").map(Number); const bl = state.builder.blocks; const j = i + dlt;
      if (bl[i] && bl[j]) { [bl[i], bl[j]] = [bl[j], bl[i]]; saveDraft(); render(); } return; }
    const bd = e.target.closest("[data-bdel]");
    if (bd) { state.builder.blocks.splice(Number(bd.dataset.bdel), 1); saveDraft(); render(); return; }
    if (e.target.closest("[data-pick]")) return openPicker();
    if (e.target.closest("[data-bsave]")) return saveBuilder();
    if (e.target.closest("[data-bcancel]")) return discardBuilder();
    if (e.target.closest("[data-pkdone]")) return closePicker();
    const pc = e.target.closest("[data-pkcat]");
    if (pc) { state.picker.cat = pc.dataset.pkcat; renderPicker(); return; }
    const pa = e.target.closest("[data-pkadd]");
    if (pa) { state.builder.blocks.push({ drill:pa.dataset.pkadd, min:8, note:"" }); saveDraft();
      $("#pk-list").innerHTML = pickerListHtml(); const f = $(".sheet-f span");
      if (f) f.innerHTML = `<b>${state.builder.blocks.length}</b> drill${state.builder.blocks.length === 1 ? "" : "s"} · <b>${draftMinutes(state.builder)}</b> min`;
      pa.textContent = "Added ✓"; pa.classList.add("is-added"); return; }
    if (state.picker.open && e.target.id === "sheet") return closePicker();
  }
  const ptab = e.target.closest("[data-practicetab]");
  if (ptab) { state.practiceTab = ptab.dataset.practicetab; render(); return; }

  const stab = e.target.closest("[data-seasontab]");
  if (stab) { state.seasonTab = stab.dataset.seasontab; render(); return; }

  const ld = e.target.closest("[data-leaders]");
  if (ld) { state.leaders = ld.dataset.leaders; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back-leaders]")) { state.leaders = null; render(); window.scrollTo(0, 0); return; }

  const bt = e.target.closest("[data-boxtab]");
  if (bt) { state.boxTab = bt.dataset.boxtab; render(); return; }

  const sort = e.target.closest("[data-sort]");
  if (sort) { state.sort = sort.dataset.sort; return render(); }

  const style = e.target.closest("[data-style]");
  if (style) {
    state.style = style.dataset.style;
    try { localStorage.setItem(LS_KEY, state.style); } catch (err) { /* private mode */ }
    setMenu(false);
    return render();
  }

  // "View full card" sits on the flipped back — handle it before the flip.
  const open = e.target.closest("[data-open]");
  if (open) { e.stopPropagation(); return openPlayer(Number(open.dataset.open)); }

  const card = e.target.closest("[data-flip]");
  if (card) flipCard(card);
});

function flipCard(card) {
  const id = Number(card.dataset.flip);
  const nowFlipped = !state.flipped.has(id);
  nowFlipped ? state.flipped.add(id) : state.flipped.delete(id);
  card.classList.toggle("is-flipped", nowFlipped);
  card.setAttribute("aria-pressed", String(nowFlipped));
  // inert keeps the face that's turned away out of the tab order and the
  // accessibility tree — backface-visibility alone still leaves it focusable.
  card.querySelector(".tc-front").inert = nowFlipped;
  card.querySelector(".tc-back").inert = !nowFlipped;
}

$("#view").addEventListener("pointermove", chartHover);
$("#view").addEventListener("touchstart", chartHover, { passive:true });
$("#view").addEventListener("touchmove", chartHover, { passive:true });
$("#view").addEventListener("pointerleave", chartLeave, true);
$("#view").addEventListener("pointerout", (e) => { if (e.target.closest && e.target.closest(".chart") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".chart"))) chartLeave(e); });

// The card shell is a div with role=button, so Enter/Space need wiring by hand.
$("#view").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest("[data-flip]");
  if (!card || card !== e.target) return;
  e.preventDefault();
  flipCard(card);
});

$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#q-clear").addEventListener("click", () => {
  state.q = ""; $("#q").value = ""; render(); $("#q").focus();
});

// Builder fields update the draft without re-rendering, so typing keeps focus.
document.addEventListener("input", (e) => {
  if (!state.builder) return;
  const t = e.target;
  if (t.id === "b-title") state.builder.title = t.value;
  else if (t.id === "b-date") state.builder.date = t.value || null;
  else if (t.id === "b-goal") state.builder.goal = t.value;
  else if (t.dataset.bnote != null) { const b = state.builder.blocks[Number(t.dataset.bnote)]; if (b) b.note = t.value; }
  else if (t.id === "pk-q") { state.picker.q = t.value; $("#pk-list").innerHTML = pickerListHtml(); return; }
  else return;
  saveDraft();
});
document.addEventListener("change", (e) => {
  if (!state.builder) return;
  const t = e.target;
  if (t.dataset.bminput != null) { const b = state.builder.blocks[Number(t.dataset.bminput)];
    if (b) { b.min = Math.max(1, Math.min(120, Math.round(Number(t.value) || 1))); saveDraft(); render(); } }
});

$("#modal-x").addEventListener("click", closePlayer);
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closePlayer(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (state.picker.open) closePicker();
  else if (state.submit) closeSubmitSheet();
  else if (!$("#modal").hidden) closePlayer();
  else if (menuOpen) { setMenu(false); $("#menu-btn").focus(); }
});

window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (TABS.includes(h)) goTab(h);
});

/* ═══════════════════════════════════════════════════════════ */
/* ── PASSWORD GATE ─────────────────────────────────────────────
   Deliberately lightweight: the code lives in this file, so it keeps casual
   visitors out, nothing more. Don't put anything genuinely private behind it. */
const GATE_CODE = "1985";
const GATE_KEY  = "shiloh-bb.gate";   // must match the pre-paint check in <head>

(function initGate() {
  const gate = $("#gate"), form = $("#gate-form"), err = $("#gate-err");
  const pin = $("#pin"), boxes = [...pin.querySelectorAll("input")];

  const unlock = () => {
    try { localStorage.setItem(GATE_KEY, "ok"); } catch (e) { /* private mode */ }
    document.documentElement.classList.add("unlocked");
    gate.setAttribute("hidden", "");
  };

  const fail = (msg) => {
    err.textContent = msg;
    pin.classList.add("is-bad");
    setTimeout(() => pin.classList.remove("is-bad"), 400);
    boxes.forEach(b => { b.value = ""; });
    boxes[0].focus();
  };

  const submit = () => {
    const code = boxes.map(b => b.value).join("");
    if (code.length < 4) return fail("Enter all four digits.");
    if (code === GATE_CODE) unlock();
    else fail("That code isn't right. Try again.");
  };

  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/\D/g, "").slice(0, 1);
      err.textContent = "";
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      if (boxes.every(b => b.value)) submit();          // auto-submit on the 4th digit
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
      if (e.key === "ArrowLeft"  && i > 0) boxes[i - 1].focus();
      if (e.key === "ArrowRight" && i < boxes.length - 1) boxes[i + 1].focus();
    });
    // Let a pasted code fill the whole row.
    box.addEventListener("paste", (e) => {
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach((d, n) => { if (boxes[n]) boxes[n].value = d; });
      boxes[Math.min(digits.length, 3)].focus();
      if (boxes.every(b => b.value)) submit();
    });
  });

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });

  if (!document.documentElement.classList.contains("unlocked")) boxes[0].focus();
  else gate.setAttribute("hidden", "");
})();

// A practice arriving by share link opens straight away.
(() => {
  const enc = params.get("plan");
  if (!enc) return;
  const p = decodePlan(enc);
  if (!p) return;
  state.shared = p; state.tab = "practice"; state.practice = p.id;
})();

renderChrome();
render();
probePhotos();
auditGames();
</script>
